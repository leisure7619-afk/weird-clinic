<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#7fb85e">
<meta name="description" content="輕鬆搞笑的醫院經營小遊戲：收治各種怪病，蓋出最奇怪的診所。">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="怪病診所">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">

<title>怪病診所</title>
<style>
:root{--bg:#fdf6e9;--ink:#3b2f2a;--card:#fffdf8;--accent:#ff7a59;--line:#ead9c3;--soft:#8a7768;--good:#3fae7a;--bad:#e2574c}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"PingFang TC","Noto Sans TC","Microsoft JhengHei",sans-serif;overflow:hidden;touch-action:manipulation;user-select:none;-webkit-user-select:none;background:#7fb85e}
#app{display:flex;flex-direction:column;height:100vh;height:100dvh;max-width:640px;margin:0 auto;position:relative}
header{position:absolute;left:0;right:0;top:0;z-index:3;padding:calc(8px + env(safe-area-inset-top)) calc(10px + env(safe-area-inset-right)) 0 calc(10px + env(safe-area-inset-left));display:flex;flex-direction:column;gap:5px;pointer-events:none}
.top{display:flex;align-items:flex-start;justify-content:space-between;gap:6px}
.brand{background:rgba(255,253,248,.92);border:2px solid var(--line);border-radius:14px;padding:4px 9px;font-weight:900;font-size:15px;line-height:1.15;white-space:nowrap;flex:none}
.brand small{display:block;font-size:10px;font-weight:700;color:var(--soft)}
.stats{display:flex;gap:4px;flex-wrap:nowrap;justify-content:flex-end;min-width:0}
.pill{background:rgba(255,253,248,.95);border:2px solid var(--line);border-radius:999px;padding:3px 7px;font-weight:800;font-size:13px;font-variant-numeric:tabular-nums;white-space:nowrap;transition:transform .15s}
.pill.bump{transform:scale(1.12)}
.pill.warn{background:#ffe3dc;border-color:#f3a593}
.row2{display:flex;gap:4px;flex-wrap:wrap;align-items:center}
.chipbtn{pointer-events:auto;background:rgba(255,253,248,.95);border:2px solid var(--line);border-radius:999px;padding:2px 9px;font-weight:800;font-size:12px;white-space:nowrap}
.buff{font-size:11px;font-weight:700;background:#fff1c7;border:1px solid #f1d27a;border-radius:8px;padding:2px 6px}
.buff.em{background:#ffdcd6;border-color:#f08a7a;animation:blink 1s infinite}
@keyframes blink{50%{opacity:.6}}
#stage{flex:1;position:relative;min-height:0}
canvas{position:absolute;inset:0;width:100%;height:100%;display:block;touch-action:none}
#banner{position:absolute;left:50%;bottom:10px;transform:translateX(-50%);background:var(--ink);color:#fff;padding:7px 8px 7px 14px;border-radius:999px;font-size:13px;font-weight:700;display:none;gap:8px;align-items:center;white-space:nowrap;z-index:2;box-shadow:0 4px 12px rgba(0,0,0,.2)}
#banner.show{display:flex}
#banner button{background:#fff;color:var(--ink);border:0;border-radius:999px;padding:3px 10px;font-size:12px;font-weight:800}
#toast{position:absolute;left:50%;top:calc(76px + env(safe-area-inset-top));transform:translateX(-50%);z-index:4;pointer-events:none;display:flex;flex-direction:column;gap:6px;align-items:center}
.tst{background:rgba(255,253,248,.97);border:2px solid var(--line);border-radius:16px;padding:6px 12px;display:flex;align-items:center;gap:8px;font-weight:800;font-size:14px;box-shadow:0 4px 14px rgba(0,0,0,.15);animation:tin .3s cubic-bezier(.2,1.4,.4,1);white-space:nowrap}
.tst .ti{font-size:26px}.tst small{display:block;font-size:11px;color:var(--soft);font-weight:700}
.tst.out{opacity:0;transform:translateY(-8px);transition:all .3s}
@keyframes tin{from{transform:scale(.7);opacity:0}}
#zoom{position:absolute;right:10px;bottom:10px;display:flex;flex-direction:column;gap:6px;z-index:2}
#zoom button{width:38px;height:38px;border-radius:12px;border:2px solid var(--line);background:rgba(255,253,248,.95);font-size:18px;font-weight:900;color:var(--ink);box-shadow:0 2px 0 var(--line)}
#ticker{margin:6px 10px;background:var(--card);border:2px solid var(--line);border-radius:14px;padding:7px 12px;font-size:13px;min-height:36px;line-height:1.45;transition:background .3s}
#ticker.flash{background:#fff4d6}
nav{display:flex;gap:5px;padding:0 8px calc(10px + env(safe-area-inset-bottom))}
nav button{flex:1;min-width:0;border:2px solid var(--line);background:var(--card);border-radius:14px;padding:6px 0 4px;font-size:11px;font-weight:800;color:var(--ink);display:flex;flex-direction:column;align-items:center;gap:1px;box-shadow:0 3px 0 var(--line);position:relative}
nav button span{font-size:19px;line-height:1.1}
nav button:active{transform:translateY(2px);box-shadow:0 1px 0 var(--line)}
nav .dot{position:absolute;top:-5px;right:-3px;background:var(--bad);color:#fff;font-size:10px;border-radius:999px;padding:1px 5px;font-weight:900}
#bottom{background:linear-gradient(#f6ecd9,#fdf6e9)}
.hidden{display:none!important}
#sheetWrap{position:fixed;inset:0;z-index:10;display:flex;flex-direction:column;justify-content:flex-end}
#sheetWrap .backdrop{position:absolute;inset:0;background:rgba(40,25,15,.35)}
.sheet{position:relative;background:var(--card);border-radius:22px 22px 0 0;max-height:78vh;overflow:auto;padding:8px 16px calc(22px + env(safe-area-inset-bottom));max-width:640px;width:100%;margin:0 auto;animation:up .22s ease-out;-webkit-overflow-scrolling:touch}
@keyframes up{from{transform:translateY(40px);opacity:0}}
.grab{width:44px;height:5px;border-radius:9px;background:var(--line);margin:4px auto 10px}
.sheet h2{margin:2px 0 4px;font-size:19px}
.sheet h4{margin:14px 0 8px;font-size:14px;color:var(--soft)}
.sheet .sub{color:var(--soft);font-size:13px;margin-bottom:12px;line-height:1.5}
.item{display:flex;gap:12px;align-items:center;padding:10px;border:2px solid var(--line);border-radius:16px;margin-bottom:8px;background:#fff}
.item .ic{font-size:28px;width:44px;height:44px;display:grid;place-items:center;border-radius:12px;flex:none}
.item .txt{flex:1;min-width:0}
.item .nm{font-weight:800;font-size:15px}
.item .ds{font-size:12px;color:var(--soft);margin-top:2px;line-height:1.4}
.item.locked{opacity:.55}
.item.done{background:#eefaf3;border-color:#bfe8cf}
.bar{height:7px;border-radius:9px;background:#f0e6d8;margin-top:6px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--good);border-radius:9px}
.btn{border:0;border-radius:12px;padding:9px 14px;font-weight:800;font-size:14px;background:var(--accent);color:#fff;white-space:nowrap;box-shadow:0 3px 0 #d65a3c}
.btn:active{transform:translateY(2px);box-shadow:0 1px 0 #d65a3c}
.btn[disabled]{background:#cbbfb3;box-shadow:0 3px 0 #b3a597}
.btn.ghost{background:#f3ebe0;color:var(--ink);box-shadow:0 3px 0 #ddcdb8}
.btn.danger{background:var(--bad);box-shadow:0 3px 0 #b84035}
.row{display:flex;gap:8px;margin-top:12px}
.row .btn{flex:1}
.kv{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:10px 0}
.kv div{background:#fbf4ea;border-radius:12px;padding:8px 10px;font-size:12px;color:var(--soft)}
.kv b{display:block;font-size:17px;color:var(--ink)}
.dex{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.card{border:2px solid var(--line);border-radius:14px;padding:10px;background:#fff;font-size:12px;line-height:1.4}
.card .big{font-size:30px}
.card .nm{font-weight:800;font-size:14px;margin:2px 0}
.card.unk{background:#f3ebe0;color:#a8998a}
.chips{display:flex;flex-wrap:wrap;gap:4px;margin-top:6px}
.chip{font-size:12px;background:#fbf4ea;border-radius:8px;padding:2px 7px}
#modalWrap{position:fixed;inset:0;z-index:20;background:rgba(40,25,15,.45);display:grid;place-items:center;padding:20px}
.modal{background:var(--card);border-radius:24px;padding:22px 20px 18px;max-width:360px;width:100%;text-align:center;animation:pop .25s cubic-bezier(.2,1.4,.4,1);box-shadow:0 10px 40px rgba(0,0,0,.25);max-height:86vh;overflow:auto}
@keyframes pop{from{transform:scale(.8);opacity:0}}
.modal .mi{font-size:56px;line-height:1.1}
.modal h3{margin:8px 0 6px;font-size:20px}
.modal p{margin:0 0 6px;font-size:14px;line-height:1.6;color:#5a4a40}
.modal .note{font-size:13px;color:var(--soft);background:#fbf4ea;border-radius:12px;padding:8px 10px;margin-top:8px;line-height:1.6;text-align:left}
.modal .award{display:flex;gap:10px;align-items:center;text-align:left;background:#fff7e6;border:2px solid #f6dfae;border-radius:14px;padding:8px 10px;margin-top:8px}
.modal .award b{display:block;font-size:14px}.modal .award span{font-size:12px;color:var(--soft)}
.modal .award .ai{font-size:30px}
.modal .row{flex-direction:column}
.delta{font-weight:800}
.delta.pos{color:var(--good)} .delta.neg{color:var(--bad)}
.toggle{display:flex;justify-content:space-between;align-items:center;padding:10px 12px;border:2px solid var(--line);border-radius:14px;background:#fff;margin-bottom:8px;font-weight:700;font-size:14px}
</style>
</head>
<body>
<div id="app">
  <div id="stage">
    <canvas id="cv"></canvas>
    <header>
      <div class="top">

</div>

<div id="sheetWrap" class="hidden"><div class="backdrop" id="sheetBg"></div><div class="sheet"><div class="grab"></div><div id="sheetBody"></div></div></div>

function migrate(s){
  if(!s) return null;
  if(s.v===1){
    const n={v:2,rooms:[],lobby:{bench:1,plant:0,vend:0,jan:0}}; ['money','rep','dex','seen','stats','buffs','t','day','tut','muted','unl'].forEach(k=>{ if(s[k]!==undefined) n[k]=s[k]; });
    const ORDER=[[0,0],[1,0],[2,0],[0,1],[1,1],[2,1],[0,2],[1,2]]; let idx=0;
    (s.tiles||[]).filter(t=>t.type!=='reception'&&ROOMS[t.type]).forEach(t=>{ if(idx<ORDER.length){ const [i,j]=ORDER[idx++]; n.rooms.push({i,j,type:t.type,lvl:t.lvl||1,n:t.n||0}); } });
    s=n;
  }
  if(s.v===2){ s.rooms=(s.rooms||[]).map(r=>Object.assign({},r,{i:r.i+1,j:r.j+1})); s.v=3; if(!s.tut) s.tut=2; }
  if(s.v!==3) return null;
  const d=newState();
  for(const k in d){ if(s[k]===undefined) s[k]=d[k]; }
  s.lobby=Object.assign({bench:1,plant:0,vend:0,jan:0},s.lobby); s.land=Object.assign({north:0,west:0,corner:0},s.land); s.stats=Object.assign({cured:0,earned:0,lost:0,emergWin:0,cleans:0},s.stats);
  return s;
}

function wingOf(i,j){ for(const k in WINGS) if(WINGS[k].slots.some(([a,b])=>a===i&&b===j)) return k; return null; }
function slotOpen(i,j){ if(i<0||j<0||i>=NS||j>=NS) return false; const w=wingOf(i,j); return !w || !!S.land[w]; }
const isLobby = s => s && s.i===LOBBY.i && s.j===LOBBY.j;
function slotOf(x,y){ if(x<0||y<0||x>=MW||y>=MW) return null; if(x%4===0||y%4===0) return null; return {i:Math.floor(x/4), j:Math.floor(y/4)}; }
function inside(x,y){
  if(x<0||y<0||x>=MW||y>=MW) return false;
  const is=x%4===0?[x/4-1,x/4]:[Math.floor(x/4)], js=y%4===0?[y/4-1,y/4]:[Math.floor(y/4)];
  for(const i of is) for(const j of js) if(slotOpen(i,j)) return true; return false;
}
const openSlots = () => { const o=[]; for(let j=0;j<NS;j++) for(let i=0;i<NS;i++) if(slotOpen(i,j)&&!(i===LOBBY.i&&j===LOBBY.j)) o.push([i,j]); return o; };

// ================= 走路 =================
function walkable(x,y){
  if(y===14 && x>=17 && x<=20) return true;
  if(!inside(x,y)) return false;
  const s=slotOf(x,y); if(!s || isLobby(s)) return true;
  return !!roomAt(s.i,s.j);
}
function roomKeyAt(x,y){ const s=slotOf(x,y); if(!s||isLobby(s)) return null; return roomAt(s.i,s.j)? s.i+','+s.j : null; }
function canStep(ax,ay,bx,by){
  if(!walkable(bx,by)) return false;
  const ra=roomKeyAt(ax,ay), rb=roomKeyAt(bx,by); if(ra===rb) return true;
  if(ra && rb) return false;
  const [i,j]=(ra||rb).split(',').map(Number), ix=4*i+3, iy=4*j+2;
  return ay===iy && by===iy && ((ax===ix&&bx===ix+1)||(bx===ix&&ax===ix+1));
}
const DIRS=[[1,0],[-1,0],[0,1],[0,-1]];
function bfs(sx,sy,tx,ty){
  const K=(x,y)=>(y+4)*40+x+4, prev=new Map([[K(sx,sy),null]]), q=[[sx,sy]];
  while(q.length){ const [x,y]=q.shift(); if(x===tx&&y===ty) break;
    for(const [dx,dy] of DIRS){ const nx=x+dx, ny=y+dy; if(nx<-2||ny<-2||nx>22||ny>20||prev.has(K(nx,ny))) continue; if(!canStep(x,y,nx,ny)) continue; prev.set(K(nx,ny),[x,y]); q.push([nx,ny]); } }
  if(!prev.has(K(tx,ty))) return null;
  const path=[]; let c=[tx,ty]; while(c){ path.push(c); c=prev.get(K(c[0],c[1])); } return path.reverse();
}
function goTo(p, tx, ty){
  const sx=Math.floor(p.x), sy=Math.floor(p.y), ex=Math.floor(tx), ey=Math.floor(ty);
  const path = walkable(sx,sy) ? bfs(sx,sy,ex,ey) : null;
  p.path=[];
  if(path){ path.slice(1,-1).forEach(([x,y])=>p.path.push({x:x+.5+(Math.random()-.5)*.25, y:y+.5+(Math.random()-.5)*.25})); }
  p.path.push({x:tx,y:ty});
}
function retarget(p,pos){ const pt={x:pos[0],y:pos[1]}; if(p.path.length) p.path[p.path.length-1]=pt; else p.path=[pt]; }
const qPos = (r,k) => { const X=4*r.i+4.5, Y=4*r.j+2.5, off=[0,.75,-.75,1.5][k]||1.5; return [X+(k>=3?.25:0), Y+off]; };
function roomSpot(r, which){ const a=RLAY[r.type][which]; return [4*r.i+1+a[0], 4*r.j+1+a[1]]; }

function beep(f,d=.08,delay=0,type='sine',vol=.06){

}

const iso=(x,y)=>({x:W/2+((x-camX)-(y-camY))*tw/2, y:H/2+10+((x-camX)+(y-camY))*th/2});

function drawGround(){
  ctx.fillStyle='#7fb85e'; ctx.fillRect(0,0,W,H);
  for(let y=-1;y<=MW;y++) for(let x=-1;x<=MW;x++){
    let near=false; for(let a=-1;a<=1&&!near;a++) for(let c=-1;c<=1&&!near;c++) if(inside(x+a,y+c)) near=true;
    if(near && !inside(x,y)) poly([iso(x,y),iso(x+1,y),iso(x+1,y+1),iso(x,y+1)],'#e5dccb');
  }
  for(let x=17;x<=21;x++) poly([iso(x,13.8),iso(x+1,13.8),iso(x+1,15.2),iso(x,15.2)],x%2?'#e8dfcf':'#ddd2bf');
  for(let x=17;x<=22;x++) poly([iso(x,15.2),iso(x+1,15.2),iso(x+1,16.8),iso(x,16.8)],'#8a8f99');
  for(let x=17;x<=22;x+=1) poly([iso(x+.2,15.95),iso(x+.7,15.95),iso(x+.7,16.05),iso(x+.2,16.05)],'#f2f2f2');
  poly([iso(17,14.1),iso(17.7,14.1),iso(17.7,14.9),iso(17,14.9)],'#e2574c');
}
function drawFloor(){
  const pulse=.5+.5*Math.sin(clock*5);
  for(let y=0;y<MW;y++) for(let x=0;x<MW;x++){
    if(!inside(x,y)) continue;
    const s=slotOf(x,y); let c;
    if(!s) c=(x+y)%2?'#d4cde8':'#c7bfe0';
    else if(isLobby(s)) c=(x+y)%2?'#eef5fd':'#d6e6f6';
    else { const r=roomAt(s.i,s.j); if(r) c=ROOMS[r.type].floor[(x+y)%2]; else c=placing?`rgba(140,215,150,${.55+.35*pulse})`:((x+y)%2?'#e6dcc8':'#ddd1ba'); }
    poly([iso(x,y),iso(x+1,y),iso(x+1,y+1),iso(x,y+1)],c,'rgba(90,70,110,.12)');
  }
  for(const [i,j] of openSlots()){
    const r=roomAt(i,j), c=iso(4*i+2.5,4*j+2.5);
    if(!r){ ctx.setLineDash([5,4]); poly([iso(4*i+1.1,4*j+1.1),iso(4*i+3.9,4*j+1.1),iso(4*i+3.9,4*j+3.9),iso(4*i+1.1,4*j+3.9)],null,'rgba(120,90,60,.45)',1.5); ctx.setLineDash([]);
      txt('+',c.x,c.y-tw*.05,tw*.32,'rgba(120,90,60,.55)'); if(tw>=30) txt('空地',c.x,c.y+tw*.22,tw*.17,'rgba(120,90,60,.55)',700); }
    else poly([iso(4*i+4,4*j+2.15),iso(4*i+4.5,4*j+2.15),iso(4*i+4.5,4*j+2.85),iso(4*i+4,4*j+2.85)],shade(ROOMS[r.type].color,.35));
  }
  // 未開放土地
  for(const k in WINGS){ if(S.land[k]) continue; const W2=WINGS[k];
    W2.slots.forEach(([i,j])=>{ ctx.setLineDash([3,5]); poly([iso(4*i+.6,4*j+.6),iso(4*i+4.4,4*j+.6),iso(4*i+4.4,4*j+4.4),iso(4*i+.6,4*j+4.4)],null,'rgba(255,255,255,.55)',1.5); ctx.setLineDash([]); });
  }
}

    else if(l.k==='ash') ellipse(c.x,c.y,s*.13,s*.05,'rgba(90,90,90,.55)');

function draw(){
  drawGround(); drawFloor(); drawLitter();
  const list=[];
  // 外牆：依開放範圍自動生成（後方高牆、前方矮牆）
  for(let y=0;y<MW;y++) for(let x=0;x<MW;x++){
    if(!inside(x,y)) continue;
    if(!inside(x,y-1)) list.push({d:x+.5+y-.01,fn:()=>wallY(y,x,x+1,.7,'#e3d5bd',null,x%2===1)});
    if(!inside(x-1,y)) list.push({d:x+y+.5-.01,fn:()=>wallX(x,y,y+1,.7,'#e3d5bd',null,y%2===1)});
    if(!inside(x,y+1)) list.push({d:x+.5+y+1,fn:()=>wallY(y+1,x,x+1,.1,'#e3d5bd')});
    if(!inside(x+1,y) && !(x===16&&y===14)) list.push({d:x+1+y+.5,fn:()=>wallX(x+1,y,y+1,.1,'#e3d5bd')});
  }
  S.rooms.forEach(r=>{ const X=4*r.i+1, Y=4*r.j+1, col=ROOMS[r.type].color;
    for(let k=0;k<3;k++){
      list.push({d:X+k+.5+Y-.01,fn:()=>wallY(Y,X+k,X+k+1,.5,'#f3e6cf',col)});
      list.push({d:X+Y+k+.5-.01,fn:()=>wallX(X,Y+k,Y+k+1,.5,'#f3e6cf',col)});
      list.push({d:X+k+.5+Y+3+.01,fn:()=>wallY(Y+3,X+k,X+k+1,.1,'#f3e6cf',col)});
      if(k!==1) list.push({d:X+3+Y+k+.5+.01,fn:()=>wallX(X+3,Y+k,Y+k+1,.1,'#f3e6cf',col)});
    }
    roomFurniture(r,list);
  });
  lobbyFurniture(list);

function route(p){
  const d=DMAP[p.d], rooms=S.rooms.filter(r=>r.type===d.room);

  if(free>=0){ seats[free]=p; p.seat=free; p.room=rkey(best); p.state='toBench'; goTo(p,...sl[free]); p.face=BENCHES[Math.floor(free/3)].face; return; }

function joinQueue(p,r){ const rt=RT[rkey(r)]; if(p.emerg){ let k=0; while(k<rt.queue.length&&rt.queue[k].emerg) k++; rt.queue.splice(k,0,p); rt.queue.forEach((q,n)=>retarget(q,qPos(r,n))); } else rt.queue.push(p); p.room=rkey(r); p.state='toQ'; p.face=1; goTo(p,...qPos(r,rt.queue.indexOf(p))); }
function payCure(p,fee,where){

function cure(p,r){

function movePerson(p,dt,speed){
  if(p.slip>0){ p.slip-=dt; return false; }
  if(!p.path.length) return false;
  const wp=p.path[0], dx=wp.x-p.x, dy=wp.y-p.y, dist=Math.hypot(dx,dy), step=speed*dt;
  p.phase+=dt*11;
  if(dist<=step){ p.x=wp.x; p.y=wp.y; p.path.shift(); return !p.path.length; }
  p.x+=dx/dist*step; p.y+=dy/dist*step; return false;
}
function update(dt){
  clock+=dt;
  floats.forEach(f=>{ f.life-=dt; f.y-=dt*30; }); floats=floats.filter(f=>f.life>0);
  patients.forEach(p=>{ if(p.sayT>0) p.sayT-=dt; }); if(sayStaff) sayStaff.t-=dt;
  if(modalOpen||!booted) return;
  S.time+=dt; if(Math.floor((S.time-dt)/YEAR)<Math.floor(S.time/YEAR)) yearEnd();
  if(!buffOn('closed')){ spawnT-=dt*(buffOn('spawn')?2:1); if(spawnT<=0){ if(patients.length<maxPatients()) spawn(); spawnT=spawnInterval()*(.6+Math.random()*.8); } }
  const sp=(buffOn('speed')?1.5:1)*(buffOn('slow')?.5:1)*(has('stetho')?1.2:1), lim=patienceLimit();
  patients.forEach(p=>{
    const fx=FX[p.d]||{}, spd=fx.slow?.85:fx.zombie?1.2:fx.back?1.3:1.9;
    if(p.ufoLift) return;
    const arrived=movePerson(p,dt,spd);
    if(p.path.length&&p.slip<=0&&p.state!=='treat'&&!has('antislip')){ for(const l of litter){ if(l.k==='jelly'&&!p.slipped[l.id]&&Math.hypot(l.x-p.x,l.y-p.y)<.22){ p.slipped[l.id]=1; if(Math.random()<.35){ p.slip=1; S.ys.slips++; sfx.slip(); ticker('🫠 有人踩到果凍滑了一跤！'); } } } }
    if(arrived){
      if(p.state==='toQ') p.state='queue';
      else if(p.state==='toBench') p.state='bench';
      else if(p.state==='enter'){ p.state='treat'; if(RLAY[roomByKey(p.room)?.type]?.hide) p.hidden=true; }
      else if(p.state==='exit') p.gone=true;
    }
    if(fx.echo&&p.state!=='exit'&&p.sayT<=0&&Math.random()<dt*.12) talk(p,pick(ECHO));
    if(p.state==='exit'&&p.litterKind){ p.litterT-=dt; if(p.litterT<=0){ const tx=Math.floor(p.x), ty=Math.floor(p.y); if(inside(tx,ty)&&!roomKeyAt(tx,ty)&&litter.length<30) litter.push({id:litId++,x:p.x,y:p.y,k:p.litterKind}); p.litterKind=null; } }
  });
  // 櫃台
  if(RQ.length&&!RQ[0].path.length){ recT+=dt*sp*(has('fastdesk')?2:1); if(recT>=.9){ recT=0; const p=RQ.shift(); RQ.forEach((q,k)=>retarget(q,RQ_POS[k])); p.wait=0; route(p); } } else recT=0;
  // 診間
  S.rooms.forEach(r=>{ const k=rkey(r), rt=RT[k]; if(!rt||ROOMS[r.type].noPatients) return;
    if(!rt.cur&&rt.queue.length){ const p=rt.queue[0]; if(p.state==='queue'&&!p.path.length){ rt.queue.shift(); rt.cur=p; p.state='enter'; p.wait=0; goTo(p,...roomSpot(r,'pat')); rt.queue.forEach((q,n)=>retarget(q,qPos(r,n))); } }
    if(rt.cur&&rt.cur.state==='treat'){ rt.prog+=dt*sp/timeOf(r); if(rt.prog>=1){ const p=rt.cur; p.x=4*r.i+3.5; p.y=4*r.j+2.5; p.hidden=false; cure(p,r); } }
  });

  patients.filter(p=>p.state==='bench'||p.state==='toBench').sort((a,b)=>(b.emerg?1e4:0)+b.wait-(a.emerg?1e4:0)-a.wait).forEach(p=>{
    const r=roomByKey(p.room); if(!r){ detach(p); route(p); return; }
    if(RT[p.room].queue.length<QMAX){ seats[p.seat]=null; p.seat=-1; joinQueue(p,r); }
  });
  // 耐心、飲料
  patients.forEach(p=>{
    const L=lim*(p.emerg?2:1);
    if(p.state==='recq'||p.state==='queue'||p.state==='bench'){ if(!p.path.length) p.wait+=dt; if(p.wait>L) lose(p,'等太久，氣噗噗地走了'); }
    else if(p.state==='confused'){ p.wait+=dt; if(p.wait>3.5) lose(p,'找不到能治的科別，默默離開了'); }
    if(S.lobby.vend&&!p.drank&&(p.state==='bench'||p.state==='recq')&&Math.random()<dt*.025){ p.drank=1; const m=has('soda')?16:8; S.money+=m; S.stats.earned+=m; const c=P3(15.75,13.2,.9); floats.push({text:'+$'+m,x:c.x,y:c.y,life:1,color:'#e2574c'}); if(Math.random()<.5){ p.litterKind=p.litterKind||'can'; p.litterT=1+Math.random()*2; } }
  });
  patients=patients.filter(p=>!p.gone);
  updateJanitors(dt); updateDucks(dt); updateUfo(dt); updateEmergency(dt); updateLab(dt);
  if(litter.length>=6&&!dirtyWarned){ dirtyWarned=true; ticker('🤢 走廊好髒，病人開始不耐煩了…'); }
  if(litter.length<3) dirtyWarned=false;
  S.ys.cleanSum+=cleanPct()*dt; S.ys.cleanN+=dt;
  eventT-=dt; if(eventT<=0){ eventT=70+Math.random()*50; if(S.stats.cured>=3) showEvent(); }
  flavorT-=dt; if(flavorT<=0){ flavorT=22+Math.random()*20; ticker(pick(FLAVOR)); }
  goalT-=dt; if(goalT<=0){ goalT=1; checkGoals(); }
  checkProgress();
}
function syncJanitors(reset){ if(reset) jans=[]; while(jans.length<S.lobby.jan) jans.push({id:jans.length+1,x:14.5+Math.random()*.6,y:15.4,path:[],state:'idle',t:Math.random()*3,phase:0,target:null}); }

    if(j.state==='clean'){ j.t-=dt*sp; if(j.t<=0){ const k=litter.indexOf(j.target); if(k>=0) litter.splice(k,1); j.target=null; j.state='idle'; j.t=.5; } return; }

function updateLab(dt){

function updateEmergency(dt){

function startEmergency(){

function endEmergency(){

// ================= 年度目標與頒獎 =================
function makeGoals(){
  const y=yearNo(), dexN=Object.keys(S.dex).length, tr=treatRooms().length, out=[];
  const C=[
    {k:'cure',n:40+25*(y-1),t:'治好 {n} 位病人'},
    {k:'earn',n:Math.round(2500*Math.pow(1.8,y-1)/100)*100,t:'今年賺 ${n}'},
    {k:'rep',n:S.rep+20+5*y,t:'聲望達到 {n}'},
    {k:'clean',n:5,t:'親手打掃 {n} 次'},
    {k:'dex',n:Math.min(DISEASES.length,dexN+2),t:'治好 {n} 種不同的怪病'}
  ];
  if(tr<openSlots().length) C.push({k:'rooms',n:tr+1,t:'擁有 {n} 間看診科別'});
  if(tr>=1&&S.stats.cured>=8) C.push({k:'emerg',n:1,t:'完成 {n} 次急診任務'});
  while(out.length<3&&C.length){ const g=C.splice(Math.floor(Math.random()*C.length),1)[0]; g.base={cure:S.stats.cured,earn:S.stats.earned,clean:S.stats.cleans,emerg:S.stats.emergWin}[g.k]||0; g.done=0; out.push(g); }
  return out;
}
function goalProg(g){
  switch(g.k){ case 'cure': return S.stats.cured-g.base; case 'earn': return S.stats.earned-g.base; case 'rep': return S.rep; case 'clean': return S.stats.cleans-g.base;
    case 'dex': return Object.keys(S.dex).length; case 'rooms': return treatRooms().length; case 'emerg': return S.stats.emergWin-g.base; } return 0;
}
const goalText = g => g.t.replace('{n}',g.k==='earn'?fmt(g.n):g.n);
function checkGoals(){
  (S.goals||[]).forEach(g=>{ if(!g.done&&goalProg(g)>=g.n){ g.done=1; const m=big(250); S.money+=m; addRep(3); sfx.fan(); toast('🎯','目標達成：'+goalText(g),'💰 +'+fmt(m)+'　⭐ +3'); } });
  const d=(S.goals||[]).filter(g=>g.done).length; $('dateChip').textContent=`📅 第${yearNo()-0}年 ${monthNo()}月　🎯 ${d}/${(S.goals||[]).length}`;
}
function yearEnd(){
  const y=yearNo()-1, ys=S.ys, cured=S.stats.cured-ys.cured0, earned=S.stats.earned-ys.earned0, lost=S.stats.lost-ys.lost0;
  const avgClean=ys.cleanN?ys.cleanSum/ys.cleanN:100, dexN=Object.keys(S.dex).length, aw=[];
  if(avgClean>=90&&cured>=20) aw.push(['clean']);
  if(ys.slips>=3) aw.push(['slips',ys.slips]);
  if(ys.cleans>=10) aw.push(['cleans',ys.cleans]);
  if(earned>=3000*Math.pow(1.8,y-1)) aw.push(['money']);
  if(cured>=20&&lost<=cured*.05) aw.push(['happy']);
  if(ys.emerg>=2) aw.push(['emerg',ys.emerg]);
  if(dexN>=10) aw.push(['dex',dexN]);
  if(ys.ducks>=3) aw.push(['ducks',ys.ducks]);
  if(!aw.length) aw.push(['try']);
  const pickA=aw.sort(()=>Math.random()-.5).slice(0,3);
  let m=0, rp=0;
  const html=pickA.map(([k,n])=>{ const A=AWARDS[k], mm=k==='try'?big(50):big(200), r=k==='try'?0:2; m+=mm; rp+=r; return `<div class="award"><div class="ai">${A.icon}</div><div><b>${A.name}</b><span>${A.txt.replace('{n}',n)}</span></div></div>`; }).join('');
  S.money+=m; S.stats.earned+=m; addRep(rp);
  const gd=(S.goals||[]).filter(g=>g.done).length;
  sfx.fan();
  queueModal({icon:'🎊',title:`第 ${y} 年 年度評鑑`,body:`<p>治好 ${cured} 人・收入 $${fmt(earned)}・目標達成 ${gd}/${(S.goals||[]).length}</p>${html}<div class="note" style="text-align:center"><span class="delta pos">💰 +${fmt(m)}${rp?'　⭐ +'+rp:''}</span></div>`,buttons:[{label:'迎接新的一年',fn:()=>{ S.ys=newYearStats(); S.goals=makeGoals(); toast('📅',`第 ${yearNo()} 年開始！`,'新的年度目標已更新'); saveLocal(); }}]});
}

// ================= 建造與擴建 =================
function build(type,i,j){
  const R=ROOMS[type];
  if(roomAt(i,j)||!slotOpen(i,j)) return false;
  if(S.money<R.cost){ ticker('💸 錢不夠，再多治幾個病人吧。'); sfx.bad(); return false; }
  S.money-=R.cost; const r={i,j,type,lvl:1,n:0}; S.rooms.push(r); RT[rkey(r)]={queue:[],cur:null,prog:0};
  litter=litter.filter(l=>{ const s=slotOf(Math.floor(l.x),Math.floor(l.y)); return !(s&&s.i===i&&s.j===j); });
  sfx.build(); bump('money'); ticker(`🏗️ ${R.icon} ${R.name}開張了！`); if(S.tut<2) S.tut=2;
  saveLocal(); return true;
}
function demolish(r){
  const k=rkey(r), affected=patients.filter(p=>p.room===k);
  S.rooms=S.rooms.filter(q=>q!==r); delete RT[k];
  affected.forEach(p=>{ if(p.seat>=0){ seats[p.seat]=null; p.seat=-1; } p.hidden=false; p.x=4*r.i+4.5; p.y=4*r.j+2.5; p.room=null; route(p); });
  const refund=Math.round(ROOMS[r.type].cost*.5); S.money+=refund;
  ticker(`🧱 ${ROOMS[r.type].name}拆掉了，回收 $${fmt(refund)}。`); saveLocal();
}
function buyWing(k){
  const w=WINGS[k]; if(S.land[k]||S.money<w.cost||S.rep<w.rep||(w.needs&&!w.needs.every(n=>S.land[n]))) return;
  S.money-=w.cost; S.land[k]=1; sfx.fan(); bump('money');
  toast('🏗️',w.name+'擴建完成！','多了 '+w.slots.length+' 塊空地');
  ticker(pick(['🚧 工人們挖出一個古董馬桶，決定把它留作紀念。','🚧 擴建完成。隔壁阿伯說他會想念這塊地。','🚧 新的土地！鴨子們已經先進去探勘了。']));
  saveLocal(); refreshSheet();
}
function setPlacing(type){ placing=type; const b=$('banner'); if(type){ $('bannerTxt').textContent=`點一塊發光的空地，放置 ${ROOMS[type].icon} ${ROOMS[type].name}`; b.classList.add('show'); } else b.classList.remove('show'); }

const ptrs=new Map(); let gest=null, sayStaff=null;
cv.addEventListener('pointerdown',e=>{
  ensureAudio(); cv.setPointerCapture&&cv.setPointerCapture(e.pointerId);
  ptrs.set(e.pointerId,{x:e.clientX,y:e.clientY});
  if(ptrs.size===1) gest={sx:e.clientX,sy:e.clientY,moved:false,lx:e.clientX,ly:e.clientY};
  else if(ptrs.size===2){ const [a,b]=[...ptrs.values()]; gest={pinch:Math.hypot(a.x-b.x,a.y-b.y),moved:true}; }
});
cv.addEventListener('pointermove',e=>{
  if(!ptrs.has(e.pointerId)||!gest) return;
  ptrs.set(e.pointerId,{x:e.clientX,y:e.clientY});
  if(ptrs.size===1&&!gest.pinch){
    if(Math.hypot(e.clientX-gest.sx,e.clientY-gest.sy)>8) gest.moved=true;
    if(gest.moved){ const dx=e.clientX-gest.lx, dy=e.clientY-gest.ly, a=dx/(tw/2), b=dy/(th/2); camX-=(a+b)/2; camY-=(b-a)/2; clampCam(); }
    gest.lx=e.clientX; gest.ly=e.clientY;
  } else if(ptrs.size===2){ const [a,b]=[...ptrs.values()], d=Math.hypot(a.x-b.x,a.y-b.y), r=cv.getBoundingClientRect(); if(gest.pinch) zoomAt(d/gest.pinch,(a.x+b.x)/2-r.left,(a.y+b.y)/2-r.top); gest.pinch=d; }
});
function endPtr(e){
  if(!ptrs.has(e.pointerId)) return;
  ptrs.delete(e.pointerId);
  if(gest&&!gest.moved&&!gest.pinch&&ptrs.size===0){ const r=cv.getBoundingClientRect(); tap(e.clientX-r.left,e.clientY-r.top); }
  if(ptrs.size===0) gest=null; else if(ptrs.size===1){ const [p]=[...ptrs.values()]; gest={sx:p.x,sy:p.y,lx:p.x,ly:p.y,moved:true}; }
}
cv.addEventListener('pointerup',endPtr); cv.addEventListener('pointercancel',endPtr);
cv.addEventListener('wheel',e=>{ e.preventDefault(); const r=cv.getBoundingClientRect(); zoomAt(e.deltaY<0?1.12:1/1.12,e.clientX-r.left,e.clientY-r.top); },{passive:false});
function tap(sx,sy){
  const w=toWorld(sx,sy);
  if(!placing){
    // 鴨子
    const dk=ducks.find(d=>{ const c=iso(d.x,d.y); return Math.hypot(sx-c.x,sy-(c.y-tw*.15))<tw*.22; });
    if(dk){ sfx.quack(); S.money+=1; S.ys.ducks++; const c=iso(dk.x,dk.y); floats.push({text:'呱！+$1',x:c.x,y:c.y-tw*.4,life:1,color:'#e09a12'}); return; }
    let hit=null, hd=-1;
    patients.forEach(p=>{ if(p.hidden) return; const c=iso(p.x,p.y); if(Math.abs(sx-c.x)<tw*.2&&sy<c.y+tw*.05&&sy>c.y-tw*1.0&&p.x+p.y>hd){ hd=p.x+p.y; hit=p; } });
    if(hit){ talk(hit,(FX[hit.d]||{}).echo?pick(ECHO):Math.random()<.4?DMAP[hit.d].desc:null); sfx.pop(); return; }
    const l=litter.find(l=>Math.hypot(l.x-w.x,l.y-w.y)<.4);
    if(l){ litter.splice(litter.indexOf(l),1); S.stats.cleans++; S.ys.cleans++; sfx.pop(); if(S.tut===2) S.tut=3; const c=iso(l.x,l.y); floats.push({text:'✨',x:c.x,y:c.y-tw*.2,life:.8,color:'#3fae7a'}); if(Math.random()<.3) ticker(pick(['🧹 院長親自打掃，大家都看到了。','🧹 院長默默把地上的東西撿起來，好有風範。','🧹 打掃完，地板亮到可以照出你的黑眼圈。'])); return; }
  }
  const tx=Math.floor(w.x), ty=Math.floor(w.y), s=slotOf(tx,ty);
  if(!s) return;
  if(!slotOpen(s.i,s.j)){ if(!placing) openLand(); return; }
  if(isLobby(s)){ if(!placing) openLobby(); return; }
  const r=roomAt(s.i,s.j);
  if(placing){ if(r){ ticker('這裡已經有房間了，換一塊空地吧。'); return; } if(build(placing,s.i,s.j)) setPlacing(null); return; }
  if(r){ const d=roomSpot(r,'doc'); sayStaff={x:d[0],y:d[1],say:pick(STAFF_SAYS),t:2.5}; openRoom(r); } else openBuild({i:s.i,j:s.j});
}

function upgrade(){ const r=roomSel, c=upCost(r); if(r.lvl>=MAXLV||S.money<c) return; S.money-=c; r.lvl++; sfx.build(); bump('money'); ticker(`⬆️ ${ROOMS[r.type].name}升到 Lv${r.lvl}。`); saveLocal(); refreshSheet(); }
function askDel(){ if(!confirmDel){ confirmDel=true; refreshSheet(); return; } demolish(roomSel); closeSheet(); }
function openLobby(){ openSheet(lobbyHTML); }
function lobbyHTML(){
  const items=Object.entries(LOBBY_UP).map(([k,U])=>{
    const lv=S.lobby[k], max=lv>=U.max, cost=U.cost[lv]||0;
    const lvTxt=k==='vend'?(lv?'已設置':'未設置'):k==='bench'?`${lv*3} 個座位`:`${lv} / ${U.max}`;
    return `<div class="item"><div class="ic" style="background:#eef5fd">${U.icon}</div><div class="txt"><div class="nm">${U.name}　<span style="font-size:12px;color:var(--soft)">${lvTxt}</span></div><div class="ds">${U.desc}</div></div>
      <button class="btn" ${max||S.money<cost?'disabled':''} data-act="buyLobby" data-arg="${k}">${max?'已滿':'$'+fmt(cost)}</button></div>`;
  }).join('');
  return `<h2>🛋️ 大廳</h2><div class="sub">整潔度 ${cleanPct()}%</div>${items}`;
}
function buyLobby(k){
  const U=LOBBY_UP[k], lv=S.lobby[k]; if(lv>=U.max) return; const cost=U.cost[lv]; if(S.money<cost) return;
  S.money-=cost; S.lobby[k]=lv+1; sfx.build(); bump('money');
  ticker({jan:'🧹 新的清潔阿姨報到！她說她什麼都見過。',bench:'🪑 大廳多了一排長椅，病人坐下就不想走了。',plant:'🪴 擺了一盆植物，大家的心情好像比較平靜了。',vend:'🥤 飲料販賣機上線！它好像會偷偷觀察每個人。'}[k]);
  if(k==='jan') syncJanitors();
  saveLocal(); refreshSheet();
}
function labHTML(){
  const rate=labRate();
  const items=RESEARCH.map(x=>{ const done=has(x.id), can=S.rp>=x.cost;
    return `<div class="item ${done?'done':''}"><div class="ic" style="background:#eefbf5">${x.icon}</div><div class="txt"><div class="nm">${x.name}</div><div class="ds">${x.desc}</div></div>
      ${done?'<div class="ds">✅ 完成</div>':`<button class="btn" ${can?'':'disabled'} data-act="buyRes" data-arg="${x.id}">🔬 ${x.cost}</button>`}</div>`; }).join('');
  return `<h2>🔬 研發</h2><div class="sub">研發點 <b>${Math.floor(S.rp)}</b>　${rate?`（每秒 +${rate.toFixed(1)}）`:'・先蓋一間 🔬 研發室才會產生研發點'}</div>${items}`;
}
function buyRes(id){
  const x=RESEARCH.find(r=>r.id===id); if(!x||has(id)||S.rp<x.cost) return;
  S.rp-=x.cost; S.res[id]=1; sfx.fan(); toast(x.icon,'研發完成：'+x.name,'');
  if(id==='reboot') ticker('🔌 重開機理論完成！科學家們決定先把自己重開機一次。');
  updateLabDot(); saveLocal(); refreshSheet();
}
function openLand(){ openSheet(landHTML); }
function landHTML(){
  const items=Object.entries(WINGS).map(([k,w])=>{ const done=S.land[k], needOk=!w.needs||w.needs.every(n=>S.land[n]), lock=S.rep<w.rep||!needOk;
    return `<div class="item ${done?'done':lock?'locked':''}"><div class="ic" style="background:#eaf5e2">🚧</div><div class="txt"><div class="nm">${w.name}</div><div class="ds">${w.desc}</div></div>
      ${done?'<div class="ds">✅ 已擴建</div>':lock?`<div class="ds" style="text-align:right">🔒<br>${needOk?'聲望 '+w.rep:'先擴建北翼和西翼'}</div>`:`<button class="btn" ${S.money<w.cost?'disabled':''} data-act="buyWing" data-arg="${k}">$${fmt(w.cost)}</button>`}</div>`; }).join('');
  return `<h2>🚧 擴建土地</h2><div class="sub">💰 ${fmt(S.money)}</div>${items}`;
}
function goalsHTML(){
  const items=(S.goals||[]).map(g=>{ const p=Math.min(g.n,goalProg(g)); return `<div class="item ${g.done?'done':''}"><div class="ic" style="background:#fff7e6">${g.done?'✅':'🎯'}</div><div class="txt"><div class="nm">${goalText(g)}</div><div class="bar"><i style="width:${Math.round(p/g.n*100)}%"></i></div><div class="ds">${g.k==='earn'?fmt(p):Math.floor(p)} / ${g.k==='earn'?fmt(g.n):g.n}</div></div></div>`; }).join('');
  const left=YEAR-(S.time%YEAR), mm=Math.floor(left/60), ss=Math.floor(left%60);
  return `<h2>📅 第 ${yearNo()} 年 ${monthNo()} 月</h2><div class="sub">年底評鑑倒數 ${mm} 分 ${ss} 秒</div>${items}`;
}
function dexHTML(){
  const found=DISEASES.filter(d=>S.dex[d.id]).length;
  const cards=DISEASES.map(d=>{
    if(S.dex[d.id]) return `<div class="card"><div class="big">${d.icon}</div><div class="nm">${d.name}</div>${d.desc}<div class="chips"><span class="chip">${ROOMS[d.room].icon} ${ROOMS[d.room].name}</span><span class="chip">治好 ${S.dex[d.id]} 人</span></div></div>`;
    if(S.seen[d.id]) return `<div class="card"><div class="big">${d.icon}</div><div class="nm">${d.name}</div>${d.desc}<div class="chips"><span class="chip">尚未治癒</span><span class="chip">需要 ${ROOMS[d.room].icon}</span></div></div>`;
    return `<div class="card unk"><div class="big">❔</div><div class="nm">？？？</div>${S.rep>=d.rep?'即將出現…':`聲望 ${d.rep} 後出現`}</div>`;
  }).join('');
  return `<h2>📖 怪病圖鑑</h2><div class="sub">已治癒 ${found} / ${DISEASES.length} 種</div><div class="dex">${cards}</div>`;
}
let confirmReset=false;
function openOffice(){ confirmReset=false; openSheet(officeHTML); }
function officeHTML(){
  return `<h2>🏥 院長室</h2><div class="sub">${titleOf(S.rep)}・${cloud.status==='cloud'?'☁️ 雲端存檔':'📱 本機存檔'}</div>
    <div class="kv"><div>累計治好<b>${fmt(S.stats.cured)} 人</b></div><div>累計收入<b>$${fmt(S.stats.earned)}</b></div>
    <div>氣跑的病人<b>${fmt(S.stats.lost)} 人</b></div><div>急診成功<b>${S.stats.emergWin} 次</b></div></div>
    <button class="btn ghost" style="width:100%;margin-bottom:8px" data-act="openGoals">🎯 今年的目標</button>
    <div class="toggle"><span>🔊 音效</span><button class="btn ghost" data-act="toggleMute">${S.muted?'關':'開'}</button></div>
    ${ON_PAGES&&!isStandalone()?`<div class="toggle" style="display:block;font-weight:500;line-height:1.7"><b>📲 加到主畫面，全螢幕玩</b><br>iPhone：Safari「分享」→「加入主畫面」<br>Android：Chrome「⋮」→「安裝應用程式」</div>`:''}
    <div class="row"><button class="btn ${confirmReset?'danger':'ghost'}" data-act="askReset">${confirmReset?'真的要重新開業？進度會全部清除':'重新開業（清除進度）'}</button></div>
    <div class="sub" style="margin-top:14px">怪病診所 v0.5</div>`;
}
function toggleMute(){ S.muted=!S.muted; saveLocal(); refreshSheet(); }
function askReset(){ if(!confirmReset){ confirmReset=true; refreshSheet(); return; } S=newState(); S.day=today(); S.tut=1; resetRuntime(); lastTitle=''; saveLocal(); cloudSave(true); closeSheet(); ticker('🏥 診所重新開業！'); updateLabDot(); }

// ================= 對話框 =================
function queueModal(m){ modalQ.push(m); if(!modalOpen) nextModal(); }
function nextModal(){
  const m=modalQ.shift(); if(!m){ modalOpen=false; $('modalWrap').classList.add('hidden'); return; }
  modalOpen=true;
  $('modalBody').innerHTML=`<div class="mi">${m.icon}</div><h3>${m.title}</h3>${m.body}<div class="row">${m.buttons.map((b,i)=>`<button class="btn ${b.ghost?'ghost':''}" data-i="${i}">${b.label}</button>`).join('')}</div>`;
  $('modalWrap').classList.remove('hidden');
  $('modalBody').querySelectorAll('button[data-i]').forEach(btn=>btn.onclick=()=>{ ensureAudio(); const b=m.buttons[+btn.dataset.i]; modalOpen=false; $('modalWrap').classList.add('hidden'); if(b.fn) b.fn(); if(!modalOpen) nextModal(); });
}
function showEvent(){
  const ev=pick(EVENTS); sfx.pop();
  queueModal({icon:ev.icon,title:ev.title,body:`<p>${ev.text}</p>`,buttons:ev.choices.map((c,i)=>({label:c.label,ghost:i===1,fn:()=>applyOutcome(ev,c.fn())}))});
}
function applyOutcome(ev,o){
  const lines=[];
  if(o.money){ S.money=Math.max(0,S.money+o.money); lines.push(`<span class="delta ${o.money>0?'pos':'neg'}">💰 ${o.money>0?'+':''}${fmt(o.money)}</span>`); }
  if(o.rep){ addRep(o.rep); lines.push(`<span class="delta ${o.rep>0?'pos':'neg'}">⭐ ${o.rep>0?'+':''}${o.rep}</span>`); }
  if(o.buff){ S.buffs[o.buff[0]]=Date.now()+o.buff[1]*1000; lines.push(`<span class="delta ${o.buff[0]==='slow'||o.buff[0]==='closed'?'neg':'pos'}">${BUFFNAME[o.buff[0]]}</span>`); }
  if(o.clean){ litter=[]; lines.push('<span class="delta pos">✨ 走廊全部清乾淨</span>'); }
  if(o.money>0||o.rep>0||o.clean) sfx.coin(); else if(o.money<0||o.rep<0) sfx.bad();
  queueModal({icon:ev.icon,title:'結果',body:`<p>${o.text}</p>${lines.length?`<div class="note" style="text-align:center">${lines.join('　')}</div>`:''}`,buttons:[{label:'好喔'}]});
  saveLocal();
}

// ================= 回歸與每日紅包 =================
function today(){ const d=new Date(); return d.getFullYear()+'-'+(d.getMonth()+1)+'-'+d.getDate(); }
function welcomeBack(savedT){
  const away=Math.min(4*3600,Math.max(0,(Date.now()-savedT)/1000));
  const curable=pool().filter(d=>S.rooms.some(r=>r.type===d.room));
  let income=0, rpGain=0;
  if(away>90&&curable.length){ const avg=curable.reduce((s,d)=>s+d.fee,0)/pool().length; income=Math.round(away/spawnInterval()*avg*.12*(has('luckycat')?2:1)); }
  if(away>90) rpGain=Math.round(away*labRate()*.3);
  let daily=0; const td=today(); if(S.day!==td){ daily=S.day?big(200):0; S.day=td; }
  if(income<=0&&daily<=0&&rpGain<=0) return;
  S.money+=income+daily; S.stats.earned+=income+daily; S.rp+=rpGain;
  const h=Math.floor(away/3600), m=Math.floor(away%3600/60);
  let body='';
  if(income>0||rpGain>0) body+=`<p>你離開了 ${h?h+' 小時 ':''}${m} 分鐘。<br>${pick(AWAY)}</p><div class="note" style="text-align:center">${income>0?`<span class="delta pos">💰 +${fmt(income)}</span>`:''}${rpGain>0?`　<span class="delta pos">🔬 +${rpGain}</span>`:''}</div>`;
  if(daily>0) body+=`<p style="margin-top:10px">🧧 今日開診紅包</p><div class="note" style="text-align:center"><span class="delta pos">💰 +${fmt(daily)}</span></div>`;
  sfx.coin(); queueModal({icon:income>0?'🌙':'🧧',title:'院長回來了！',body,buttons:[{label:'開始看診'}]});
}
function tutorial(){ if(S.tut>0) return; S.tut=1; S.day=today(); ticker('🏥 歡迎，院長。病人快來了…'); }

// ================= 雲端存檔（Claude 連結限定） =================
const ON_PAGES=/\.github\.io$/.test(location.hostname);
const cloud={ref:null,status:'local',busy:false,last:''};
const sleep=ms=>new Promise(r=>setTimeout(r,ms));
async function initCloud(){
  if(ON_PAGES||location.protocol==='file:'||/^(localhost|127\.)/.test(location.hostname)) return null;
  for(let i=0;i<25&&!(window.claude&&window.claude.use);i++) await sleep(200);
  if(!(window.claude&&window.claude.use)) return null;
  const [db,user]=await Promise.all([window.claude.use('db'),window.claude.use('user')]);
  if(!db||!user) return null;
  const uid=await user.id(); if(!uid) return null;
  cloud.ref=db.collection('data/users/'+uid).doc('save');
  const snap=await cloud.ref.get(); cloud.status='cloud';
  if(snap&&snap.exists){ const d=snap.data(); if(d&&typeof d.json==='string'){ try{ return migrate(JSON.parse(d.json)); }catch(e){} } }
  return null;
}
async function cloudSave(force){
  if(!cloud.ref||cloud.busy) return;
  S.t=Date.now(); const j=JSON.stringify(S);
  if(!force&&j===cloud.last) return;
  cloud.busy=true;
  try{ await cloud.ref.set({json:j,t:S.t}); cloud.last=j; cloud.status='cloud'; }
  catch(e){ if(e&&['invalid_argument','revoked','not_granted','capability_disabled'].includes(e.code)){ cloud.ref=null; cloud.status='local'; } }
  finally{ cloud.busy=false; }
}

// ================= 啟動 =================
let last=performance.now();
function loop(now){
  const dt=Math.min(.1,(now-last)/1000); last=now;
  update(dt); draw(); hud();
  saveT+=dt; if(saveT>5){ saveT=0; saveLocal(); }
  cloudT+=dt; if(cloudT>30){ cloudT=0; cloudSave(); }
  requestAnimationFrame(loop);
}
function boot(){
  const local=loadLocal(), hadLocal=!!local;
  S=local||newState(); resetRuntime(); lastTitle=titleOf(S.rep);
  const savedT=S.t;
  layout(); window.addEventListener('resize',layout);
  requestAnimationFrame(loop);
  if(!hadLocal&&!ON_PAGES&&location.protocol!=='file:') ticker('☁️ 讀取存檔中…');
  let settled=false;
  const apply=s=>{ S=s; resetRuntime(); lastTitle=titleOf(S.rep); ticker('☁️ 已載入雲端存檔。'); };
  const finish=cloudS=>{
    if(settled){ if(cloudS&&cloudS.t>S.t+2000) apply(cloudS); return; }
    settled=true; let t0=savedT;
    if(cloudS&&(!hadLocal||cloudS.t>savedT+2000)){ apply(cloudS); t0=cloudS.t; }
    booted=true;
    if(S.tut===0) tutorial(); else { ticker(pick(['🏥 開始營業！今天也會很怪。','🏥 院長到！病人們假裝很正常。','🏥 開門了，第一位病人已經在門口奇怪地站著。'])); welcomeBack(t0); }
    checkProgress(); checkGoals(); updateLabDot(); saveLocal();
  };
  initCloud().then(finish).catch(()=>finish(null));
  setTimeout(()=>finish(null),hadLocal?1500:6000);
  document.addEventListener('visibilitychange',()=>{ if(document.hidden){ saveLocal(); cloudSave(); } });
}
boot();
if(ON_PAGES&&'serviceWorker' in navigator){ window.addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>{})); }
</script>
