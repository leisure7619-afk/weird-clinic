<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#7fb85e">
<meta name="description" content="輕鬆搞笑的城市經營小遊戲：當個愛賺錢的市長，打造柴犬友善的搞怪城市。">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="搞怪城市">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<title>搞怪城市</title>
<style>
:root{--bg:#fdf6e9;--ink:#3b2f2a;--card:#fffdf8;--accent:#ff7a59;--line:#ead9c3;--soft:#8a7768;--good:#3fae7a;--bad:#e2574c}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"PingFang TC","Noto Sans TC","Microsoft JhengHei",sans-serif;overflow:hidden;touch-action:manipulation;user-select:none;-webkit-user-select:none;background:#7fb85e}
#app{display:flex;flex-direction:column;height:100vh;height:100dvh;max-width:640px;margin:0 auto;position:relative}
header{position:absolute;left:0;right:0;top:0;z-index:3;padding:calc(8px + env(safe-area-inset-top)) calc(10px + env(safe-area-inset-right)) 0 calc(10px + env(safe-area-inset-left));display:flex;flex-direction:column;gap:5px;pointer-events:none}
.top{display:flex;align-items:flex-start;justify-content:space-between;gap:6px}
.brand{background:rgba(255,253,248,.92);border:2px solid var(--line);border-radius:14px;padding:4px 9px;font-weight:900;font-size:15px;line-height:1.15;white-space:nowrap;flex:none}
.brand small{display:block;font-size:10px;font-weight:700;color:var(--soft)}
.stats{display:flex;gap:4px;flex-wrap:nowrap;justify-content:flex-end;min-width:0}
.pill{background:rgba(255,253,248,.95);border:2px solid var(--line);border-radius:999px;padding:3px 7px;font-weight:800;font-size:13px;font-variant-numeric:tabular-nums;white-space:nowrap;transition:transform .15s}
.pill.bump{transform:scale(1.12)}
.pill.warn{background:#ffe3dc;border-color:#f3a593}
.row2{display:flex;gap:4px;flex-wrap:wrap;align-items:center}
#deputy{pointer-events:auto;display:flex;align-items:center;gap:8px;align-self:flex-start;max-width:min(94vw,520px);background:rgba(255,253,248,.96);border:2px solid #9b6dd6;border-radius:14px;padding:5px 10px 5px 6px;box-shadow:0 3px 0 rgba(155,109,214,.25);font-size:13px;font-weight:700;line-height:1.35;color:var(--ink);transition:transform .2s}
#deputy.hidden{display:none}
#deputy .dav{font-size:22px;background:#f1e8fb;border-radius:50%;width:32px;height:32px;display:flex;align-items:center;justify-content:center;flex:none}
#deputy.urgent{border-color:#e2574c;background:#fff1ee;animation:pulse .7s infinite alternate}
#deputy.good{border-color:#3fae7a;background:#eefaf3}
#deputy b{color:#7a4fc0}
#depGo{font-size:20px;color:#9b6dd6;flex:none}
#depTxt{flex:1;min-width:0}
#stage.dep #toast{top:calc(150px + env(safe-area-inset-top))}
.chipbtn{pointer-events:auto;background:rgba(255,253,248,.95);border:2px solid var(--line);border-radius:999px;padding:2px 9px;font-weight:800;font-size:12px;white-space:nowrap}
#satChip{display:flex;align-items:center;gap:5px;padding:2px 9px 2px 8px}#satChip .lb{font-size:11px;color:var(--soft)}#satChip .stars{position:relative;display:inline-block;font-size:16px;line-height:1;letter-spacing:1px}#satChip .bg{color:#e2d6c4}#satChip .fg{position:absolute;left:0;top:0;overflow:hidden;white-space:nowrap;color:#f2b544;width:50%}#satChip.warn{background:#ffe3dc;border-color:#f3a593}#satChip.warn .fg{color:#e2574c}
#voteChip.ok{background:#eefaf3;border-color:#3fae7a}#voteChip.mid{background:#fff3df;border-color:#f2b544}#voteChip.bad{background:#ffe3dc;border-color:#e2574c;animation:pulse .8s infinite alternate}
@keyframes pulse{to{transform:scale(1.05)}}
.buff{font-size:11px;font-weight:700;background:#fff1c7;border:1px solid #f1d27a;border-radius:8px;padding:2px 6px}
.buff.em{background:#ffdcd6;border-color:#f08a7a;animation:blink 1s infinite}
@keyframes blink{50%{opacity:.6}}
#stage{flex:1;position:relative;min-height:0}
canvas{position:absolute;inset:0;width:100%;height:100%;display:block;touch-action:none}
#banner{position:absolute;left:8px;right:56px;bottom:10px;margin:0 auto;width:max-content;max-width:calc(100% - 64px);background:var(--ink);color:#fff;padding:7px 8px 7px 14px;border-radius:999px;font-size:13px;font-weight:700;display:none;gap:8px;align-items:center;white-space:normal;line-height:1.35;z-index:2;box-shadow:0 4px 12px rgba(0,0,0,.2)}
#banner.show{display:flex}
#bannerTxt{flex:1;min-width:0}
#banner button{flex:none}
#banner button{background:#fff;color:var(--ink);border:0;border-radius:999px;padding:3px 10px;font-size:12px;font-weight:800}
#banner button.ok{background:#3fae7a;color:#fff;padding:5px 12px;font-size:13px}
#toast{position:absolute;left:50%;top:calc(76px + env(safe-area-inset-top));transition:top .2s;transform:translateX(-50%);z-index:4;pointer-events:none;display:flex;flex-direction:column;gap:6px;align-items:center}
.tst{background:rgba(255,253,248,.97);border:2px solid var(--line);border-radius:16px;padding:6px 12px;display:flex;align-items:center;gap:8px;font-weight:800;font-size:14px;box-shadow:0 4px 14px rgba(0,0,0,.15);animation:tin .3s cubic-bezier(.2,1.4,.4,1);white-space:nowrap}
.tst .ti{font-size:26px}.tst small{display:block;font-size:11px;color:var(--soft);font-weight:700}
.tst.out{opacity:0;transform:translateY(-8px);transition:all .3s}
@keyframes tin{from{transform:scale(.7);opacity:0}}
#zoom{position:absolute;right:10px;bottom:10px;display:flex;flex-direction:column;gap:6px;z-index:2}
#zoom button{width:38px;height:38px;border-radius:12px;border:2px solid var(--line);background:rgba(255,253,248,.95);font-size:18px;font-weight:900;color:var(--ink);box-shadow:0 2px 0 var(--line)}
#ticker{margin:6px 10px;background:var(--card);border:2px solid var(--line);border-radius:14px;padding:7px 12px;font-size:13px;min-height:36px;line-height:1.45;transition:background .3s}
#ticker.flash{background:#fff4d6}
nav{display:flex;gap:5px;padding:0 8px calc(10px + env(safe-area-inset-bottom))}
nav button{flex:1;min-width:0;border:2px solid var(--line);background:var(--card);border-radius:14px;padding:6px 0 4px;font-size:11px;font-weight:800;color:var(--ink);display:flex;flex-direction:column;align-items:center;gap:1px;box-shadow:0 3px 0 var(--line);position:relative}
nav button span{font-size:19px;line-height:1.1}
nav button:active{transform:translateY(2px);box-shadow:0 1px 0 var(--line)}
nav .dot{position:absolute;top:-5px;right:-3px;background:var(--bad);color:#fff;font-size:10px;border-radius:999px;padding:1px 5px;font-weight:900}
#bottom{background:linear-gradient(#f6ecd9,#fdf6e9)}
.hidden{display:none!important}
#sheetWrap{position:fixed;inset:0;z-index:10;display:flex;flex-direction:column;justify-content:flex-end}
#sheetWrap .backdrop{position:absolute;inset:0;background:rgba(40,25,15,.35)}
.sheet{position:relative;background:var(--card);border-radius:22px 22px 0 0;max-height:78vh;overflow:auto;padding:8px 16px calc(22px + env(safe-area-inset-bottom));max-width:640px;width:100%;margin:0 auto;animation:up .22s ease-out;-webkit-overflow-scrolling:touch}
@keyframes up{from{transform:translateY(40px);opacity:0}}
.grab{width:44px;height:5px;border-radius:9px;background:var(--line);margin:4px auto 10px}
.sheet h2{margin:2px 0 4px;font-size:19px}
.sheet h4{margin:14px 0 8px;font-size:14px;color:var(--soft)}
.sheet .sub{color:var(--soft);font-size:13px;margin-bottom:12px;line-height:1.5}
.item{display:flex;gap:12px;align-items:center;padding:10px;border:2px solid var(--line);border-radius:16px;margin-bottom:8px;background:#fff}
.item .ic{font-size:28px;width:44px;height:44px;display:grid;place-items:center;border-radius:12px;flex:none}
.item .txt{flex:1;min-width:0}
.item .nm{font-weight:800;font-size:15px}
.item .ds{font-size:12px;color:var(--soft);margin-top:2px;line-height:1.4}
.item.locked{opacity:.55}
.item.done{background:#eefaf3;border-color:#bfe8cf}
.bar{height:7px;border-radius:9px;background:#f0e6d8;margin-top:6px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--good);border-radius:9px}
.btn{border:0;border-radius:12px;padding:9px 14px;font-weight:800;font-size:14px;background:var(--accent);color:#fff;white-space:nowrap;box-shadow:0 3px 0 #d65a3c}
.btn:active{transform:translateY(2px);box-shadow:0 1px 0 #d65a3c}
.btn[disabled]{background:#cbbfb3;box-shadow:0 3px 0 #b3a597}
.btn.ghost{background:#f3ebe0;color:var(--ink);box-shadow:0 3px 0 #ddcdb8}
.btn.danger{background:var(--bad);box-shadow:0 3px 0 #b84035}
.row{display:flex;gap:8px;margin-top:12px}
.row .btn{flex:1}
.kv{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:10px 0}
.kv div{background:#fbf4ea;border-radius:12px;padding:8px 10px;font-size:12px;color:var(--soft)}
.kv b{display:block;font-size:17px;color:var(--ink)}
.dex{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.card{border:2px solid var(--line);border-radius:14px;padding:10px;background:#fff;font-size:12px;line-height:1.4}
.card .big{font-size:30px}
.card .nm{font-weight:800;font-size:14px;margin:2px 0}
.card.unk{background:#f3ebe0;color:#a8998a}
.chips{display:flex;flex-wrap:wrap;gap:4px;margin-top:6px}
.chip{font-size:12px;background:#fbf4ea;border-radius:8px;padding:2px 7px}
#modalWrap{position:fixed;inset:0;z-index:20;background:rgba(40,25,15,.45);display:grid;place-items:center;padding:20px}
.modal{background:var(--card);border-radius:24px;padding:22px 20px 18px;max-width:360px;width:100%;text-align:center;animation:pop .25s cubic-bezier(.2,1.4,.4,1);box-shadow:0 10px 40px rgba(0,0,0,.25);max-height:86vh;overflow:auto}
@keyframes pop{from{transform:scale(.8);opacity:0}}
.modal .mi{font-size:56px;line-height:1.1}
.modal h3{margin:8px 0 6px;font-size:20px}
.modal p{margin:0 0 6px;font-size:14px;line-height:1.6;color:#5a4a40}
.modal .note{font-size:13px;color:var(--soft);background:#fbf4ea;border-radius:12px;padding:8px 10px;margin-top:8px;line-height:1.6;text-align:left}
.modal .award{display:flex;gap:10px;align-items:center;text-align:left;background:#fff7e6;border:2px solid #f6dfae;border-radius:14px;padding:8px 10px;margin-top:8px}
.modal .award b{display:block;font-size:14px}.modal .award span{font-size:12px;color:var(--soft)}
.modal .award .ai{font-size:30px}
.modal .row{flex-direction:column}
.delta{font-weight:800}
.delta.pos{color:var(--good)} .delta.neg{color:var(--bad)}
.seg{display:flex;gap:6px;margin:4px 0 12px}
.seg button{flex:1;border:2px solid var(--line);background:#fff;border-radius:12px;padding:8px 0;font-weight:800;font-size:14px;color:var(--ink)}
.seg button.on{background:#3fae7a;border-color:#3fae7a;color:#fff}
.toggle{display:flex;justify-content:space-between;align-items:center;padding:10px 12px;border:2px solid var(--line);border-radius:14px;background:#fff;margin-bottom:8px;font-weight:700;font-size:14px}
</style>
</head>
<body>
<div id="app">
  <div id="stage">
    <canvas id="cv"></canvas>
    <header>
      <div class="top">
        <div class="brand" id="brandName">搞怪城市</div>
        <div class="stats">
          <div class="pill" id="money">💰 0</div>
          <div class="pill" id="rep">👥 0</div>
        </div>
      </div>
      <div class="row2"><button class="chipbtn sat" id="satChip"><span class="lb">市民滿意度</span><span class="stars"><span class="bg">★★★★★</span><span class="fg" id="satFg">★★★★★</span></span></button><button class="chipbtn" id="voteChip">🗳️</button></div>
      <div id="deputy" class="hidden"><span class="dav">🧑‍💼</span><span id="depTxt"></span><span id="depGo">›</span></div>
    </header>
    <div id="zoom"><button id="zIn">＋</button><button id="zOut">－</button><button id="zRot" class="hidden" title="旋轉">⟳</button><button id="zHome">⌖</button><button id="zFull" class="hidden">⛶</button></div>
    <div id="toast"></div>
    <div id="banner"><span id="bannerTxt"></span><button id="bannerOK" class="hidden ok">✓ 蓋這裡</button><button id="bannerX">取消</button></div>
  </div>
  <div id="bottom">
    <div id="ticker">🏙️ 城市準備中…</div>
    <nav id="navC">
      <button id="cBuild"><span>🏗️</span>建設</button>
      <button id="cRoad"><span>🛣️</span>鋪路</button>
      <button id="cBull"><span>🧹</span>拆除</button>
      <button id="cGov"><span>📊</span>市政</button>
      <button id="cSet"><span>⚙️</span>設定</button>
    </nav>
  </div>
</div>

<div id="sheetWrap" class="hidden"><div class="backdrop" id="sheetBg"></div><div class="sheet"><div class="grab"></div><div id="sheetBody"></div></div></div>
<div id="modalWrap" class="hidden"><div class="modal" id="modalBody"></div></div>

<script>
'use strict';
// ================= 資料 =================
// ---- 院所等級（參考台灣：基層診所 → 地區醫院 → 區域醫院 → 醫學中心） ----
const BUFFNAME = {cityhappy:'🎉 市民開心',citysad:'😞 市民失望'};
const big = n => Math.round(n*(1+(S.city?S.city.stage:0)*.5));
// ================= 地圖 =================
const SKINS=['#f5d0b5','#e8b48f','#c98e66','#8d5a3b','#f2c9a0'];
const HAIRS=['#3b2a20','#6b4a2f','#1e1e1e','#b5763a','#d9c27a','#8a8a8a'];
const SHIRTS=['#e2574c','#f4a259','#5b8e7d','#4d7cc7','#9b6dd6','#e46aa0','#3fae7a','#f2c14e','#5bc0eb'];
const PANTS=['#3b4a6b','#4a3b2f','#2f2f3a','#5a6b7a'];
const pick = a => a[Math.floor(Math.random()*a.length)];

// ================= 狀態 =================
const SAVE_KEY = 'weird-clinic-v1', MONTH = 45, YEAR = MONTH*12;
let S, floats = [];
let modalQ = [], modalOpen = false, saveT = 0, cloudT = 0;
let placing = null, booted = false, sheetFn = null;

function newState(){
  return {v:3,money:3000,stats:{earned:0},buffs:{},t:Date.now(),day:'',tut:0,muted:false,time:0,city:initCity()};
}
function migrate(s){
  if(!s||s.v!==3) return null;
  const d=newState(); for(const k in d){ if(s[k]===undefined) s[k]=d[k]; }
  ['rooms','lobby','land','rp','res','dex','seen','unl','goals','ys','garden','tier','deco','rep'].forEach(k=>delete s[k]);
  s.stats={earned:(s.stats&&s.stats.earned)||0};
  return s;
}
function loadLocal(){ try{ const j=localStorage.getItem(SAVE_KEY); if(j) return migrate(JSON.parse(j)); }catch(e){} return null; }
function saveLocal(){ S.t=Date.now(); try{ localStorage.setItem(SAVE_KEY, JSON.stringify(S)); }catch(e){} }
function resetRuntime(){
  floats=[];
  if(S.city){ cityRebuild(); cityCalc(); } cars=[]; peds=[];
}
const buffOn = k => (S.buffs[k]||0) > Date.now();
function fmt(n){ n=Math.floor(n); const neg=n<0; n=Math.abs(n); let s; if(n>=1e6) s=(n/1e6).toFixed(1)+'M'; else if(n>=1e4) s=(n/1e3).toFixed(1)+'K'; else s=n.toLocaleString('en-US'); return (neg?'-':'')+s; }
const seasonOf = m => m<=3?'spring':m<=6?'summer':m<=9?'autumn':'winter';
const SEASON_ICON={spring:'🌸',summer:'☀️',autumn:'🍁',winter:'❄️'};
const GROUND={spring:'#86c062',summer:'#7fb85e',autumn:'#a3b45c',winter:'#b9c9b2'};
const CANOPY={spring:['#5bb04a','#86d26c','#6fc25a'],summer:['#3f8a3c','#4f9a4a','#5fb35a'],autumn:['#d9662f','#e39b3a','#efb44a'],winter:['#6f8f76','#7f9f86','#93b39a']};
const yearNo = () => Math.floor(S.time/YEAR)+1, monthNo = () => Math.floor((S.time%YEAR)/MONTH)+1;

// ================= 土地 =================
// ================= 走路 =================
const DIRS=[[1,0],[-1,0],[0,1],[0,-1]];
// ================= 音效 =================
let actx=null;
function ensureAudio(){ try{ if(!actx){ const A=window.AudioContext||window.webkitAudioContext; if(A) actx=new A(); } if(actx&&actx.state==='suspended') actx.resume().catch(()=>{}); }catch(e){} }
function beep(f,d=.08,delay=0,type='sine',vol=.06){
  if((S&&S.muted)||!actx) return;
  try{ const t0=actx.currentTime+delay, o=actx.createOscillator(), g=actx.createGain();
    o.type=type; o.frequency.setValueAtTime(f,t0); g.gain.setValueAtTime(vol,t0); g.gain.exponentialRampToValueAtTime(.0001,t0+d);
    o.connect(g); g.connect(actx.destination); o.start(t0); o.stop(t0+d+.02); }catch(e){}
}
const sfx = {
  coin:()=>{ beep(988,.07); beep(1319,.12,.07); },
  build:()=>{ beep(330,.08,0,'square',.04); beep(440,.08,.08,'square',.04); beep(660,.14,.16,'square',.04); },
  bad:()=>{ beep(220,.18,0,'sawtooth',.03); },
  pop:()=>{ beep(600,.06,0,'triangle',.06); },
  slip:()=>{ beep(700,.25,0,'sine',.05); beep(300,.25,.12,'sine',.05); },
  quack:()=>{ beep(520,.07,0,'square',.04); beep(440,.09,.08,'square',.04); },
  siren:()=>{ [0,1,2,3].forEach(k=>beep(k%2?660:880,.18,k*.2,'triangle',.05)); },
  boom:()=>{ beep(90,.3,0,'sawtooth',.06); },
  ufo:()=>{ [0,1,2,3,4].forEach(k=>beep(400+k*120,.1,k*.06,'sine',.04)); },
  fan:()=>{ [523,659,784,1047].forEach((f,i)=>beep(f,.14,i*.09,'triangle',.05)); }
};

// ================= 鏡頭 =================
const cv=document.getElementById('cv'), stage=document.getElementById('stage'); let ctx=cv.getContext('2d');
let W=0,H=0,tw=40,th=20,zoom=1,camX=7,camY=7,baseTw=40;
function layout(){
  const r=stage.getBoundingClientRect(); W=r.width; H=r.height;
  const dpr=Math.min(2,window.devicePixelRatio||1);
  cv.width=Math.round(W*dpr); cv.height=Math.round(H*dpr); ctx.setTransform(dpr,0,0,dpr,0,0);
  baseTw=Math.max(30,Math.min(W/8.6,H/5.2)); applyZoom();
}
function applyZoom(){ zoom=Math.max(.45,Math.min(2.4,zoom)); tw=baseTw*zoom; th=tw/2; }
let rot=0, ROTV=0, RAW=false; const RC=15;
const VR=(x,y,r)=>r===1?[y,2*RC-x]:r===2?[2*RC-x,2*RC-y]:r===3?[2*RC-y,x]:[x,y];
const VRi=(u,v,r)=>r===1?[2*RC-v,u]:r===2?[2*RC-u,2*RC-v]:r===3?[v,2*RC-u]:[u,v];
const iso=(x,y)=>{ let cx=camX, cy=camY; if(ROTV){ if(!RAW){ const q=VR(x,y,ROTV); x=q[0]; y=q[1]; } const c=VR(camX,camY,ROTV); cx=c[0]; cy=c[1]; } return {x:W/2+((x-cx)-(y-cy))*tw/2, y:H/2+10+((x-cx)+(y-cy))*th/2}; };
function toWorld(sx,sy){ const a=(sx-W/2)/(tw/2), b=(sy-H/2-10)/(th/2); if(!ROTV) return {x:camX+(a+b)/2, y:camY+(b-a)/2}; const c=VR(camX,camY,ROTV), q=VRi(c[0]+(a+b)/2,c[1]+(b-a)/2,ROTV); return {x:q[0],y:q[1]}; }
function panView(du,dv){ if(!ROTV){ camX+=du; camY+=dv; } else { const c=VR(camX,camY,ROTV), q=VRi(c[0]+du,c[1]+dv,ROTV); camX=q[0]; camY=q[1]; } clampCam(); }
const dep=(x,y)=>{ if(!ROTV) return x+y; const q=VR(x,y,ROTV); return q[0]+q[1]; };

function wrapText(t,maxW){ const out=[]; let line=''; for(const ch of t){ if(ctx.measureText(line+ch).width>maxW&&line){ out.push(line); line=ch; } else line+=ch; } if(line) out.push(line); return out.slice(0,3); }
function drawThink(p){
  const c=iso(p.x,p.y), fs=Math.max(12,Math.min(15,tw*.28)); ctx.font=`700 ${Math.round(fs)}px sans-serif`;
  const lines=wrapText(p.think,Math.min(W*.66,260)), lh=fs*1.35;
  const w=Math.max(...lines.map(l=>ctx.measureText(l).width))+22, h=lines.length*lh+14;
  const headY=c.y-tw*((p.look&&p.look.h)||1)*.95, bx=Math.max(4,Math.min(W-w-4,c.x-w/2)), by=headY-h-tw*.32;
  circle(c.x+tw*.05,headY-tw*.08,3,'#fff'); circle(c.x+tw*.1,headY-tw*.2,4.5,'#fff');
  ctx.save(); ctx.shadowColor='rgba(0,0,0,.18)'; ctx.shadowBlur=6; rrect(bx,by,w,h,h/2>18?18:h/2,'#ffffff'); ctx.restore();
  rrect(bx,by,w,h,h/2>18?18:h/2,null,'#d9c9ae');
  ctx.fillStyle='#3b2f2a'; ctx.textAlign='left'; ctx.textBaseline='middle'; lines.forEach((l,k)=>ctx.fillText(l,bx+11,by+7+lh*(k+.5)));
}

function drawNight(){ const k=NIGHT;
  ctx.fillStyle=`rgba(14,20,62,${(.52*k).toFixed(3)})`; ctx.fillRect(0,0,W,H);
  if(!NLC){ NLC=document.createElement('canvas'); }
  if(NLC.width!==cv.width||NLC.height!==cv.height){ NLC.width=cv.width; NLC.height=cv.height; }
  const lc=NLC.getContext('2d'); lc.setTransform(1,0,0,1,0,0); lc.clearRect(0,0,NLC.width,NLC.height); lc.setTransform(ctx.getTransform());
  const byB=new Map(); NWIN.forEach(w=>{ let a=byB.get(w.b); if(!a){ a=[]; byB.set(w.b,a); } a.push(w); });
  const blk=CS.pw&&CS.pw.ratio<.7, wcol=blk?'#5a5a6a':'#ffd77a';
  const L=S.city.b.filter(b=>b._hit).sort((a,b)=>a._hit.d-b._hit.d), sv=ctx; ctx=lc;
  L.forEach(b=>{ ctx.globalCompositeOperation='destination-out'; poly(b._hit.poly,'#000'); ctx.globalCompositeOperation='source-over';
    if(!b.ok||b.burnt) return; const ws=byB.get(b), fr=LITFRAC[b.t]??.35;

    if(!blk||CB[b.t].pwr){ const fs=LITM.get(b); if(fs) fs.forEach(f=>f()); } });
  ctx=sv; ctx.save(); ctx.setTransform(1,0,0,1,0,0); ctx.globalAlpha=Math.min(1,k*1.15); ctx.drawImage(NLC,0,0); ctx.restore(); SIGLIT.forEach(([x,y,r,c])=>circle(x,y,r,c));
}

function makeDecision(){ const c=DECS.map(d=>({d,w:d.id===S.city.lastDec?0:d.w()})).filter(o=>o.w>0); if(!c.length) return null; let t=c.reduce((a,o)=>a+o.w,0)*Math.random(); let pickD=c[0].d; for(const o of c){ t-=o.w; if(t<=0){ pickD=o.d; break; } }
  S.city.lastDec=pickD.id; const P=P10(Math.max(800,Math.min(20000,netPerMin()*1.5))); const d=pickD.make(P); d.opts=d.opts.filter(o=>o&&(o.kind!=='build'||o.k)&&(o.kind!=='dem'||o.b)); return d; }
function shuffle(a){ for(let i=a.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]]; } return a; }

    buttons:opts.map(o=>({label:(hint&&o.kind==='trap'?'🤔 ':'')+o.label,ghost:o.kind==='none',
      sub:o.kind==='none'?'不花錢・支持率 -2':o.cost<0?`市庫 +$${fmt(-o.cost)}`:o.cost===0?'免費':`$${fmt(o.cost)}${o.kind==='build'?'（2 倍價）':o.kind==='dem'?'（拆除工程費 2 倍，不退錢）':''}${o.dis?'・'+o.dis:''}`,
      dis:!!o.dis||(o.cost>0&&S.money<o.cost),fn:()=>runOpt(d,o)}))}); }
function runOpt(d,o){ const v=voteState(); let stars=o.stars||0, extra='';
  if(o.kind==='none'){ v.bonus=(v.bonus||0)-2; sfx.bad(); queueModal({icon:'😶',title:'暫不處理',body:'<p>議員們嘆了一口氣，把提案收進抽屜。</p><div class="note">🗳️ 支持率 -2（算到下次選舉）</div>',buttons:[{label:'好'}]}); saveLocal(); return; }
  if(o.cost>0&&S.money<o.cost){ sfx.bad(); return; }
  if(o.kind==='build'){ const sp=aiSpot(o.k); if(!sp||!cityPlace(o.k,sp.x,sp.y,{cost:o.cost,ai:1})){ sfx.bad(); toast('🤖','找不到地方蓋','錢沒有扣'); return; }
    const nb=S.city.b[S.city.b.length-1]; stars=nb.stars||0; camX=sp.x+CB[o.k].w/2; camY=sp.y+CB[o.k].w/2; clampCam(); extra=`📍 AI 選的位置：附近住了 ${Math.round(nearPop(sp.x,sp.y,CB[o.k].w,4))} 人`; }
  else { S.money-=o.cost; }
  if(o.kind==='dem'&&S.city.b.includes(o.b)){ camX=o.b.x+BW(o.b)/2; camY=o.b.y+BW(o.b)/2; clampCam(); cityBulldoze(o.b.x,o.b.y,{noRefund:1}); }
  (o.fx||[]).forEach(f=>S.city.fx.push({k:f.k,s:f.s,m:f.m,n:f.n,until:S.time+f.t,lb:f.lb}));
  const dv=o.kind==='trap'?0:stars>=4?2:stars>=3?1:0; v.bonus=(v.bonus||0)+dv; cityDirty=true; cityCalc();
  if(o.kind==='trap') sfx.bad(); else sfx.fan();
  queueModal({icon:o.kind==='trap'?'🙈':d.icon,title:o.kind==='trap'?'錢花了，但是…':'方案執行！',body:`<p>${o.txt||''}</p><div class="note" style="text-align:center"><div style="font-size:24px;color:#f2b544;letter-spacing:3px">${'★'.repeat(stars)}<span style="color:#d8cdbd">${'☆'.repeat(5-stars)}</span></div>市民滿意度 ${o.kind==='trap'?'<b>+0</b>　這是陷阱…':''}${dv?`<br>🗳️ 支持率 +${dv}`:''}${extra?'<br>'+extra:''}${o.fx&&o.fx[0]&&o.fx[0].lb?`<br>⏱️ ${o.fx[0].lb} 效果開始`:''}</div>`,buttons:[{label:'好'}]});
  saveLocal(); }

function roadNbrs(x,y){ return DIRS.map(([a,b])=>[x+a,y+b]).filter(([a,b])=>isRoad(a,b)); }

// ---- 大眾運輸：捷運高架、公車路線、空中航線 ----
let transit={key:'',mrt:null,trains:[],route:null,buses:[],air:[]};
const bctr=b=>[b.x+BW(b)/2,b.y+BW(b)/2];
function nnOrder(arr){ if(arr.length<3) return arr.slice(); const out=[arr[0]], rest=arr.slice(1); while(rest.length){ const l=bctr(out[out.length-1]); let bi=0,bd=1e9; rest.forEach((q,i)=>{ const c=bctr(q), d=Math.hypot(c[0]-l[0],c[1]-l[1]); if(d<bd){ bd=d; bi=i; } }); out.push(rest.splice(bi,1)[0]); } return out; }
function roadNear(b){ const w=BW(b); for(let i=-1;i<=w;i++) for(let j=-1;j<=w;j++){ if((i<0||i>=w||j<0||j>=w)&&!((i<0||i>=w)&&(j<0||j>=w))&&isRoad(b.x+i,b.y+j)) return [b.x+i,b.y+j]; } return null; }
function bfsPath(a,b){ const k=(x,y)=>x+','+y, prev=new Map([[k(a[0],a[1]),null]]), q=[a]; let h=0; while(h<q.length){ const [x,y]=q[h++]; if(x===b[0]&&y===b[1]){ const out=[]; let c=k(x,y); while(c){ out.push(c.split(',').map(Number)); c=prev.get(c); } return out.reverse(); } for(const [dx,dy] of DIRS){ const nx=x+dx, ny=y+dy, kk=k(nx,ny); if(!prev.has(kk)&&isRoad(nx,ny)){ prev.set(kk,k(x,y)); q.push([nx,ny]); } } } return null; }
function polyLen(P){ let L=0; for(let i=1;i<P.length;i++) L+=Math.hypot(P[i][0]-P[i-1][0],P[i][1]-P[i-1][1]); return L; }
function polyAt(P,s){ for(let i=1;i<P.length;i++){ const d=Math.hypot(P[i][0]-P[i-1][0],P[i][1]-P[i-1][1]); if(s<=d||i===P.length-1){ const t=d?Math.min(1,s/d):0; return [P[i-1][0]+(P[i][0]-P[i-1][0])*t,P[i-1][1]+(P[i][1]-P[i-1][1])*t]; } s-=d; } return P[P.length-1]; }
const TRACK_COST=600, TRACK_UP=.5;
function mrtRoute(list){ if(list.length<2) return null; let best=null;
  list.forEach((s0,i)=>{ const ord=[s0], rest=list.filter((_,j)=>j!==i); while(rest.length){ const l=bctr(ord[ord.length-1]); let bi=0,bd=1e9; rest.forEach((q,j)=>{ const c=bctr(q), d=Math.abs(c[0]-l[0])+Math.abs(c[1]-l[1]); if(d<bd){ bd=d; bi=j; } }); ord.push(rest.splice(bi,1)[0]); }
    const C=ord.map(bctr), P=[C[0]], idx=[0]; C.slice(1).forEach(c=>{ const l=P[P.length-1]; if(l[0]!==c[0]&&l[1]!==c[1]) P.push([c[0],l[1]]); P.push(c); idx.push(P.length-1); }); const L=polyLen(P); if(!best||L<best.L) best={P,idx,L,C}; });
  const C=best.C, f=C[0], l=C[C.length-1], close=Math.abs(f[0]-l[0])+Math.abs(f[1]-l[1]); let ring=false;
  if(C.length>=4&&close<=best.L*.4){ ring=true; if(l[0]!==f[0]&&l[1]!==f[1]) best.P.push([f[0],l[1]]); best.P.push(f); best.idx.push(best.P.length-1); best.L=polyLen(best.P); }

const mrtOk=()=>S.city.b.filter(b=>b.t==='mrt'&&b.ok&&!b.burnt);
function trackAdd(x,y){ const cur=mrtOk(), r0=mrtRoute(cur), r1=mrtRoute(cur.concat([{t:'mrt',x,y,w:2}])); return Math.max(0,Math.round((r1?r1.L:0)-(r0?r0.L:0))); }
function rebuildTransit(){
  const key=S.city.b.filter(b=>['mrt','bus','balloon','airport'].includes(b.t)&&b.ok).map(b=>b.t+b.x+','+b.y).join('|')+'#'+ROADS.size;
  if(key===transit.key) return; transit.key=key;

  const mr=mrtRoute(mrtOk()); transit.mrt=null;
  if(mr){ const P=mr.P, L=mr.L, stopS=mr.stopIdx.map(i=>polyLen(P.slice(0,i+1))); transit.mrt={P,L,stopS,ring:mr.ring,tiles:Math.round(L),n:mr.n};
    const n=Math.min(3,mr.n-1); if(transit.trains.length!==n) transit.trains=Array.from({length:n},(_,i)=>({s:L*i/n,dwell:0,last:-1,dir:i%2?-1:1}));
    transit.trains.forEach(t=>{ t.s=mr.ring?t.s%L:Math.max(0,Math.min(L,t.s)); });
    if(!S.city.mrtLine){ S.city.mrtLine=1; S.city.trk=1; toast('🚇','捷運通車了！','兩站之間自動蓋好高架軌道'); }

  if(rt.length>=2){ let P=[rt[0]]; for(let i=0;i<rt.length;i++){ const seg=bfsPath(P[P.length-1],rt[(i+1)%rt.length]); if(seg) P=P.concat(seg.slice(1)); } if(P.length>2) transit.route={P,stops:new Set(rt.map(r=>r[0]+','+r[1]))}; }
  else if(rt.length===1){ const prev=new Map([[rt[0].join(','),null]]), q=[rt[0]]; let h=0, far=rt[0]; while(h<q.length&&h<60){ const [x,y]=q[h++]; far=[x,y]; for(const [dx,dy] of DIRS){ const kk=(x+dx)+','+(y+dy); if(!prev.has(kk)&&isRoad(x+dx,y+dy)){ prev.set(kk,1); q.push([x+dx,y+dy]); } } } const go=bfsPath(rt[0],far), back=go&&bfsPath(far,rt[0]); if(go&&back&&go.length>1) transit.route={P:go.concat(back.slice(1)),stops:new Set([rt[0].join(',')])}; }

function updateTransit(dt){ transit.buses.forEach(a=>{ if(!a.col) a.col=['#3fae7a','#f2b544','#4d7cc7'][transit.buses.indexOf(a)%3]; a.kind='bus'; });

}
function drawMrtPillars(list){ const m=transit.mrt; if(!m) return; const P=m.P; let acc=0; for(let i=1;i<P.length;i++){ const d=Math.hypot(P[i][0]-P[i-1][0],P[i][1]-P[i-1][1]); for(let s=(1.5-acc%1.5);s<d;s+=1.5){ const t=s/d, x=P[i-1][0]+(P[i][0]-P[i-1][0])*t, y=P[i-1][1]+(P[i][1]-P[i-1][1])*t; if(bAt(Math.floor(x),Math.floor(y))) continue; list.push({d:dep(x,y)+.3,fn:()=>{ const q=R2(x,y); RAW=true; const g=iso(q[0],q[1]); ellipse(g.x,g.y,tw*.14,tw*.06,'rgba(0,0,0,.18)'); box(q[0]-.1,q[1]-.1,.2,.2,.78,'#c3c8cf'); box(q[0]-.2,q[1]-.2,.4,.4,.14,'#cdd1d7',.78); RAW=false; }}); } acc+=d; } }

    <div class="row"><button class="btn ${confirmReset?'danger':'ghost'}" data-act="askReset">${confirmReset?'真的嗎？城市、勳章、圖鑑全部清除':'清除全部進度'}</button></div>
    <div class="sub" style="margin-top:14px">搞怪城市 v2.6.3</div>`;
}
function toggleMute(){ S.muted=!S.muted; saveLocal(); refreshSheet(); }
function toggleNight(){ S.noNight=!S.noNight; saveLocal(); refreshSheet(); ticker(S.noNight?'☀️ 日夜變化關掉了，城市永遠是白天。':'🌙 日夜變化打開了。'); }
function askReset(){ if(!confirmReset){ confirmReset=true; refreshSheet(); return; } confirmReset=false; S=newState(); S.day=today(); S.tut=1; transit={key:'',mrt:null,trains:[],route:null,buses:[],air:[]}; CMB=[]; cmbKey=''; resetRuntime(); camX=citySize()/2; camY=citySize()/2; zoom=cityZoom(); applyZoom(); saveLocal(); cloudSave(true); closeSheet(); cityIntro(); ticker('🏙️ 新的城市開始了！市民們搬著行李進城。'); }

// ================= 對話框 =================
function queueModal(m){ modalQ.push(m); if(!modalOpen) nextModal(); }
function nextModal(){
  const m=modalQ.shift(); if(!m){ modalOpen=false; $('modalWrap').classList.add('hidden'); return; }
  modalOpen=true;
  $('modalBody').innerHTML=`<div class="mi">${m.icon}</div><h3>${m.title}</h3>${m.body}<div class="row">${m.buttons.map((b,i)=>`<button class="btn ${b.ghost?'ghost':''}" data-i="${i}" ${b.dis?'disabled':''}>${b.label}${b.sub?`<small style="display:block;font-weight:600;font-size:11px;opacity:.85;margin-top:2px">${b.sub}</small>`:''}</button>`).join('')}</div>`;
  $('modalWrap').classList.remove('hidden');
  $('modalBody').querySelectorAll('button[data-i]').forEach(btn=>btn.onclick=()=>{ ensureAudio(); const b=m.buttons[+btn.dataset.i]; modalOpen=false; $('modalWrap').classList.add('hidden'); if(b.fn) b.fn(); if(!modalOpen) nextModal(); });
}
// ================= 回歸與每日紅包 =================
function today(){ const d=new Date(); return d.getFullYear()+'-'+(d.getMonth()+1)+'-'+d.getDate(); }
function welcomeBack(savedT){
  const away=Math.min(4*3600,Math.max(0,(Date.now()-savedT)/1000));
  let income=0; if(away>60){ cityCalc(); income=Math.round(away*cityRate()*(.3+.15*upL('away'))); }
  let daily=0; const td=today(); if(S.day!==td){ daily=S.day?Math.round(Math.max(500,(S.city.stage+1)*800)):0; S.day=td; }
  if(income===0&&daily<=0) return;
  S.money+=income+daily; if(income>0) S.stats.earned+=income; if(daily>0) S.stats.earned+=daily;
  const h=Math.floor(away/3600), m=Math.floor(away%3600/60);
  let body='';
  if(income!==0) body+=`<p>市長，你離開了 ${h?h+' 小時 ':''}${m} 分鐘。<br>${income>0?'市民照常上班、消費，我幫你把帳記好了：':'你不在的時候，維護費還是照付…'}</p><div class="note">💰 城市淨收入 <b class="delta ${income>0?'pos':'neg'}">${income>0?'+':''}$${fmt(Math.abs(income))}</b><br>📊 平常每分鐘 $${fmt(Math.abs(cityRate()*60))}，你不在時打 ${Math.round((.3+.15*upL('away'))*100)}% 折<br>👥 人口 ${fmt(CS.pop)}・😊 幸福度 ${CS.happy}${CS.pw&&CS.pw.ratio<1?'<br>⚡ 注意：現在電不夠用':''}</div>`;
  if(daily>0) body+=`<p style="margin-top:10px">🧧 今日市長紅包</p><div class="note" style="text-align:center"><span class="delta pos">💰 +${fmt(daily)}</span></div>`;
  sfx.coin(); queueModal({icon:'🧑‍💼',title:'副市長報帳',body,buttons:[{label:'開始上班'}]});
}

// ================= 雲端存檔（Claude 連結限定） =================
const ON_PAGES=/\.github\.io$/.test(location.hostname);
const cloud={ref:null,status:'local',busy:false,last:''};
const sleep=ms=>new Promise(r=>setTimeout(r,ms));
async function initCloud(){
  if(ON_PAGES||location.protocol==='file:'||/^(localhost|127\.)/.test(location.hostname)) return null;
  for(let i=0;i<25&&!(window.claude&&window.claude.use);i++) await sleep(200);
  if(!(window.claude&&window.claude.use)) return null;
  const [db,user]=await Promise.all([window.claude.use('db'),window.claude.use('user')]);
  if(!db||!user) return null;
  const uid=await user.id(); if(!uid) return null;
  cloud.ref=db.collection('data/users/'+uid).doc('save');
  const snap=await cloud.ref.get(); cloud.status='cloud';
  if(snap&&snap.exists){ const d=snap.data(); if(d&&typeof d.json==='string'){ try{ return migrate(JSON.parse(d.json)); }catch(e){} } }
  return null;
}
async function cloudSave(force){
  if(!cloud.ref||cloud.busy) return;
  S.t=Date.now(); const j=JSON.stringify(S);
  if(!force&&j===cloud.last) return;
  cloud.busy=true;
  try{ await cloud.ref.set({json:j,t:S.t}); cloud.last=j; cloud.status='cloud'; }
  catch(e){ if(e&&['invalid_argument','revoked','not_granted','capability_disabled'].includes(e.code)){ cloud.ref=null; cloud.status='local'; } }
  finally{ cloud.busy=false; }
}

// ================= 啟動 =================
let last=performance.now();
function cityTime(dt){
  clock+=dt; floats.forEach(f=>{ f.life-=dt; f.y-=dt*30; }); floats=floats.filter(f=>f.life>0);
  if(modalOpen||!booted) return; S.time+=dt;
  { const nt=nightK()>.5; if(nt!==wasNight){ wasNight=nt; if(nt) ticker(pick(['🌙 天黑了，夜市開張，家家戶戶亮起燈。','🌙 晚上了，柴犬們排隊散步回家。','🌙 夜深了，便利商店的燈是全城最亮的。'])); else ticker(pick(['☀️ 天亮了，早餐店的蛋餅香味飄滿整條街。','☀️ 早安！公車司機（鴨子）準時發車。'])); } }
  if(weather.t>0){ weather.t-=dt; if(weather.t<=0) weather={type:'clear',t:0}; }
  else { weatherT-=dt; if(weatherT<=0){ weatherT=150+Math.random()*120; const se=seasonOf(monthNo()); if(se==='winter'){ weather={type:'snow',t:40}; ticker(pick(['❄️ 下雪了！市民在市政府門口堆了一個柴犬雪人。','❄️ 下雪了，鴨子們穿上了小圍巾（想像的）。'])); } else { weather={type:'rain',t:25}; ticker(pick(['🌧️ 下雨了，柴犬們拒絕出門散步。','🌧️ 一陣雨，雨傘店老闆偷偷笑了。','🌧️ 下雨了，公園的花都喝飽了。'])); } } }
}
function loop(now){
  const dt=Math.min(.1,(now-last)/1000); last=now;
  ROTV=mode==='city'?rot:0; RAW=false;
  try{ cityTime(dt); if(booted&&!modalOpen) cityUpdate(dt); drawCity(); hud(); }catch(e){ console.error(e); }
  saveT+=dt; if(saveT>5){ saveT=0; saveLocal(); }
  cloudT+=dt; if(cloudT>30){ cloudT=0; cloudSave(); }
  requestAnimationFrame(loop);
}
function boot(){
  const local=loadLocal(), hadLocal=!!local;
  S=local||newState(); resetRuntime();
  camX=citySize()/2; camY=citySize()/2; zoom=1.15;
  const savedT=S.t;
  layout(); window.addEventListener('resize',layout);
  requestAnimationFrame(loop);
  if(!hadLocal&&!ON_PAGES&&location.protocol!=='file:') ticker('☁️ 讀取存檔中…');
  let settled=false;
  const apply=s=>{ S=s; resetRuntime(); ticker('☁️ 已載入雲端存檔。'); };
  const finish=cloudS=>{
    if(settled){ if(cloudS&&cloudS.t>S.t+2000) apply(cloudS); return; }
    settled=true; let t0=savedT;
    if(cloudS&&(!hadLocal||cloudS.t>savedT+2000)){ apply(cloudS); t0=cloudS.t; }
    booted=true;
    mode='city'; camX=citySize()/2; camY=citySize()/2; zoom=cityZoom(); applyZoom(); 
    ticker(pick(['🏙️ 早安，市長！今天的城市也很怪。','🏙️ 市長上班了，鴨子們在市政府門口排隊。']));
    if(S.tut===0){ S.tut=1; S.day=today(); } else { welcomeBack(t0); }
    makeKidLooks(); if(S.city.over) showGameOver(); else if(S.city.settled) chooseMap(); else cityIntro(); lastCityKey=''; saveLocal();
  };
  initCloud().then(finish).catch(()=>finish(null));
  setTimeout(()=>finish(null),hadLocal?1500:6000);
  document.addEventListener('visibilitychange',()=>{ if(document.hidden){ saveLocal(); cloudSave(); } });
}
boot();
if(ON_PAGES&&'serviceWorker' in navigator){ window.addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>{})); }
</script>
