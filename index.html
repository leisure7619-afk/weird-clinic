<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#7fb85e">
<meta name="description" content="輕鬆搞笑的醫院經營小遊戲：收治各種怪病，蓋出最奇怪的診所。">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="怪病診所">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<title>怪病診所</title>
<style>
:root{--bg:#fdf6e9;--ink:#3b2f2a;--card:#fffdf8;--accent:#ff7a59;--line:#ead9c3;--soft:#8a7768;--good:#3fae7a;--bad:#e2574c}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"PingFang TC","Noto Sans TC","Microsoft JhengHei",sans-serif;overflow:hidden;touch-action:manipulation;user-select:none;-webkit-user-select:none;background:#7fb85e}
#app{display:flex;flex-direction:column;height:100vh;height:100dvh;max-width:640px;margin:0 auto;position:relative}
header{position:absolute;left:0;right:0;top:0;z-index:3;padding:calc(8px + env(safe-area-inset-top)) calc(10px + env(safe-area-inset-right)) 0 calc(10px + env(safe-area-inset-left));display:flex;flex-direction:column;gap:5px;pointer-events:none}
.top{display:flex;align-items:flex-start;justify-content:space-between;gap:6px}
.brand{background:rgba(255,253,248,.92);border:2px solid var(--line);border-radius:14px;padding:4px 9px;font-weight:900;font-size:15px;line-height:1.15;white-space:nowrap;flex:none}
.brand small{display:block;font-size:10px;font-weight:700;color:var(--soft)}
.stats{display:flex;gap:4px;flex-wrap:nowrap;justify-content:flex-end;min-width:0}
.pill{background:rgba(255,253,248,.95);border:2px solid var(--line);border-radius:999px;padding:3px 7px;font-weight:800;font-size:13px;font-variant-numeric:tabular-nums;white-space:nowrap;transition:transform .15s}
.pill.bump{transform:scale(1.12)}
.pill.warn{background:#ffe3dc;border-color:#f3a593}
.buffs{display:flex;gap:4px;flex-wrap:wrap}
.buff{font-size:11px;font-weight:700;background:#fff1c7;border:1px solid #f1d27a;border-radius:8px;padding:2px 6px}
#stage{flex:1;position:relative;min-height:0}
canvas{position:absolute;inset:0;width:100%;height:100%;display:block;touch-action:none}
#banner{position:absolute;left:50%;bottom:10px;transform:translateX(-50%);background:var(--ink);color:#fff;padding:7px 8px 7px 14px;border-radius:999px;font-size:13px;font-weight:700;display:none;gap:8px;align-items:center;white-space:nowrap;z-index:2;box-shadow:0 4px 12px rgba(0,0,0,.2)}
#banner.show{display:flex}
#banner button{background:#fff;color:var(--ink);border:0;border-radius:999px;padding:3px 10px;font-size:12px;font-weight:800}
#toast{position:absolute;left:50%;top:calc(64px + env(safe-area-inset-top));transform:translateX(-50%);z-index:4;pointer-events:none;display:flex;flex-direction:column;gap:6px;align-items:center}
.tst{background:rgba(255,253,248,.97);border:2px solid var(--line);border-radius:16px;padding:6px 12px;display:flex;align-items:center;gap:8px;font-weight:800;font-size:14px;box-shadow:0 4px 14px rgba(0,0,0,.15);animation:tin .3s cubic-bezier(.2,1.4,.4,1);white-space:nowrap}
.tst .ti{font-size:26px}.tst small{display:block;font-size:11px;color:var(--soft);font-weight:700}
.tst.out{opacity:0;transform:translateY(-8px);transition:all .3s}
@keyframes tin{from{transform:scale(.7);opacity:0}}
#zoom{position:absolute;right:10px;bottom:10px;display:flex;flex-direction:column;gap:6px;z-index:2}
#zoom button{width:38px;height:38px;border-radius:12px;border:2px solid var(--line);background:rgba(255,253,248,.95);font-size:18px;font-weight:900;color:var(--ink);box-shadow:0 2px 0 var(--line)}
#ticker{margin:6px 10px;background:var(--card);border:2px solid var(--line);border-radius:14px;padding:7px 12px;font-size:13px;min-height:36px;line-height:1.45;transition:background .3s}
#ticker.flash{background:#fff4d6}
nav{display:flex;gap:6px;padding:0 10px calc(10px + env(safe-area-inset-bottom))}
nav button{flex:1;border:2px solid var(--line);background:var(--card);border-radius:14px;padding:7px 0 5px;font-size:12px;font-weight:800;color:var(--ink);display:flex;flex-direction:column;align-items:center;gap:1px;box-shadow:0 3px 0 var(--line)}
nav button span{font-size:19px;line-height:1.1}
nav button:active{transform:translateY(2px);box-shadow:0 1px 0 var(--line)}
#bottom{background:linear-gradient(#f6ecd9,#fdf6e9)}
.hidden{display:none!important}
#sheetWrap{position:fixed;inset:0;z-index:10;display:flex;flex-direction:column;justify-content:flex-end}
#sheetWrap .backdrop{position:absolute;inset:0;background:rgba(40,25,15,.35)}
.sheet{position:relative;background:var(--card);border-radius:22px 22px 0 0;max-height:78vh;overflow:auto;padding:8px 16px 22px;max-width:640px;width:100%;margin:0 auto;animation:up .22s ease-out;-webkit-overflow-scrolling:touch}
@keyframes up{from{transform:translateY(40px);opacity:0}}
.grab{width:44px;height:5px;border-radius:9px;background:var(--line);margin:4px auto 10px}
.sheet h2{margin:2px 0 4px;font-size:19px}
.sheet .sub{color:var(--soft);font-size:13px;margin-bottom:12px;line-height:1.5}
.item{display:flex;gap:12px;align-items:center;padding:10px;border:2px solid var(--line);border-radius:16px;margin-bottom:8px;background:#fff}
.item .ic{font-size:28px;width:44px;height:44px;display:grid;place-items:center;border-radius:12px;flex:none}
.item .txt{flex:1;min-width:0}
.item .nm{font-weight:800;font-size:15px}
.item .ds{font-size:12px;color:var(--soft);margin-top:2px;line-height:1.4}
.item.locked{opacity:.55}
.btn{border:0;border-radius:12px;padding:9px 14px;font-weight:800;font-size:14px;background:var(--accent);color:#fff;white-space:nowrap;box-shadow:0 3px 0 #d65a3c}
.btn:active{transform:translateY(2px);box-shadow:0 1px 0 #d65a3c}
.btn[disabled]{background:#cbbfb3;box-shadow:0 3px 0 #b3a597}
.btn.ghost{background:#f3ebe0;color:var(--ink);box-shadow:0 3px 0 #ddcdb8}
.btn.danger{background:var(--bad);box-shadow:0 3px 0 #b84035}
.row{display:flex;gap:8px;margin-top:12px}
.row .btn{flex:1}
.kv{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:10px 0}
.kv div{background:#fbf4ea;border-radius:12px;padding:8px 10px;font-size:12px;color:var(--soft)}
.kv b{display:block;font-size:17px;color:var(--ink)}
.dex{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.card{border:2px solid var(--line);border-radius:14px;padding:10px;background:#fff;font-size:12px;line-height:1.4}
.card .big{font-size:30px}
.card .nm{font-weight:800;font-size:14px;margin:2px 0}
.card.unk{background:#f3ebe0;color:#a8998a}
.chips{display:flex;flex-wrap:wrap;gap:4px;margin-top:6px}
.chip{font-size:12px;background:#fbf4ea;border-radius:8px;padding:2px 7px}
#modalWrap{position:fixed;inset:0;z-index:20;background:rgba(40,25,15,.45);display:grid;place-items:center;padding:20px}
.modal{background:var(--card);border-radius:24px;padding:22px 20px 18px;max-width:360px;width:100%;text-align:center;animation:pop .25s cubic-bezier(.2,1.4,.4,1);box-shadow:0 10px 40px rgba(0,0,0,.25)}
@keyframes pop{from{transform:scale(.8);opacity:0}}
.modal .mi{font-size:56px;line-height:1.1}
.modal h3{margin:8px 0 6px;font-size:20px}
.modal p{margin:0 0 6px;font-size:14px;line-height:1.6;color:#5a4a40}
.modal .note{font-size:13px;color:var(--soft);background:#fbf4ea;border-radius:12px;padding:8px 10px;margin-top:8px;line-height:1.6;text-align:left}
.modal .row{flex-direction:column}
.delta{font-weight:800}
.delta.pos{color:var(--good)} .delta.neg{color:var(--bad)}
.toggle{display:flex;justify-content:space-between;align-items:center;padding:10px 12px;border:2px solid var(--line);border-radius:14px;background:#fff;margin-bottom:8px;font-weight:700;font-size:14px}
</style>
</head>
<body>
<div id="app">
  <div id="stage">
    <canvas id="cv"></canvas>
    <header>
      <div class="top">
        <div class="brand">怪病診所 <small id="title">巷口小診所</small></div>
        <div class="stats">
          <div class="pill" id="money">💰 0</div>
          <div class="pill" id="rep">⭐ 0</div>
          <div class="pill" id="clean">✨ 100%</div>
        </div>
      </div>
      <div class="buffs" id="buffs"></div>
    </header>
    <div id="zoom"><button id="zIn">＋</button><button id="zOut">－</button><button id="zHome">⌖</button><button id="zFull" class="hidden">⛶</button></div>
    <div id="toast"></div>
    <div id="banner"><span id="bannerTxt"></span><button id="bannerX">取消</button></div>
  </div>
  <div id="bottom">
    <div id="ticker">🏥 診所開張準備中…</div>
    <nav>
      <button id="navBuild"><span>🏗️</span>建造</button>
      <button id="navLobby"><span>🛋️</span>大廳</button>
      <button id="navDex"><span>📖</span>圖鑑</button>
      <button id="navOffice"><span>🏥</span>院長室</button>
    </nav>
  </div>
</div>

<div id="sheetWrap" class="hidden"><div class="backdrop" id="sheetBg"></div><div class="sheet"><div class="grab"></div><div id="sheetBody"></div></div></div>
<div id="modalWrap" class="hidden"><div class="modal" id="modalBody"></div></div>

// ================= 走路 =================
function slotOf(x,y){ if(x<0||y<0||x>=MW||y>=MW) return null; if(x%4===0||y%4===0) return null; return {i:Math.floor(x/4), j:Math.floor(y/4)}; }
const isLobby = s => s && s.i===2 && s.j===2;
function walkable(x,y){
  if(y===10 && x>=13 && x<=16) return true;
  if(x<0||y<0||x>=MW||y>=MW) return false;
  const s=slotOf(x,y); if(!s || isLobby(s)) return true;
  return !!roomAt(s.i,s.j);
}
function roomKeyAt(x,y){ const s=slotOf(x,y); if(!s||isLobby(s)) return null; return roomAt(s.i,s.j)? s.i+','+s.j : null; }
function canStep(ax,ay,bx,by){
  if(!walkable(bx,by)) return false;
  const ra=roomKeyAt(ax,ay), rb=roomKeyAt(bx,by); if(ra===rb) return true;
  if(ra && rb) return false;
  const [i,j]=(ra||rb).split(',').map(Number), ix=4*i+3, iy=4*j+2;
  return ay===iy && by===iy && ((ax===ix&&bx===ix+1)||(bx===ix&&ax===ix+1));
}
const DIRS=[[1,0],[-1,0],[0,1],[0,-1]];
function bfs(sx,sy,tx,ty){
  const K=(x,y)=>y*32+x+8, prev=new Map([[K(sx,sy),null]]), q=[[sx,sy]];
  while(q.length){ const [x,y]=q.shift(); if(x===tx&&y===ty) break;
    for(const [dx,dy] of DIRS){ const nx=x+dx, ny=y+dy; if(nx<-1||ny<-1||nx>17||ny>14||prev.has(K(nx,ny))) continue; if(!canStep(x,y,nx,ny)) continue; prev.set(K(nx,ny),[x,y]); q.push([nx,ny]); } }
  if(!prev.has(K(tx,ty))) return null;
  const path=[]; let c=[tx,ty]; while(c){ path.push(c); c=prev.get(K(c[0],c[1])); } return path.reverse();
}
function goTo(p, tx, ty){
  const sx=Math.floor(p.x), sy=Math.floor(p.y), ex=Math.floor(tx), ey=Math.floor(ty);
  const path = walkable(sx,sy) ? bfs(sx,sy,ex,ey) : null;
  p.path=[];
  if(path){ path.slice(1,-1).forEach(([x,y])=>p.path.push({x:x+.5+(Math.random()-.5)*.25, y:y+.5+(Math.random()-.5)*.25})); }
  p.path.push({x:tx,y:ty});
}
function retarget(p,pos){ const pt={x:pos[0],y:pos[1]}; if(p.path.length) p.path[p.path.length-1]=pt; else p.path=[pt]; }
const qPos = (r,k) => { const X=4*r.i+4.5, Y=4*r.j+2.5, off=[0,.75,-.75,1.5][k]||1.5; return [X+(k>=3?.25:0), Y+off]; };
function roomSpot(r, which){ const L=RLAY[r.type], a=L[which]; return [4*r.i+1+a[0], 4*r.j+1+a[1]]; }

let W=0,H=0,tw=40,th=20,zoom=1,camX=7.2,camY=7,baseTw=40;
function layout(){

}
function applyZoom(){ zoom=Math.max(.5,Math.min(2.4,zoom)); tw=baseTw*zoom; th=tw/2; }
const iso = (x,y)=>({x: W/2 + ((x-camX)-(y-camY))*tw/2, y: H/2 + 10 + ((x-camX)+(y-camY))*th/2});
function toWorld(sx,sy){ const a=(sx-W/2)/(tw/2), b=(sy-H/2-10)/(th/2); return {x:camX+(a+b)/2, y:camY+(b-a)/2}; }
function clampCam(){ camX=Math.max(-1,Math.min(15,camX)); camY=Math.max(-1,Math.min(14,camY)); }
function zoomAt(f, sx, sy){ const before=toWorld(sx,sy); zoom*=f; applyZoom(); const after=toWorld(sx,sy); camX+=before.x-after.x; camY+=before.y-after.y; clampCam(); }

// ================= 繪圖工具 =================
function shade(hex, amt){
  const c = parseInt(hex.slice(1),16); const ch = [c>>16, c>>8&255, c&255].map(v=>Math.max(0,Math.min(255,Math.round(amt<0? v*(1+amt) : v+(255-v)*amt))));
  return `rgb(${ch[0]},${ch[1]},${ch[2]})`;
}
function poly(pts, fill, stroke, lw){ ctx.beginPath(); pts.forEach((p,i)=> i?ctx.lineTo(p.x,p.y):ctx.moveTo(p.x,p.y)); ctx.closePath(); if(fill){ctx.fillStyle=fill; ctx.fill();} if(stroke){ctx.strokeStyle=stroke; ctx.lineWidth=lw||1; ctx.stroke();} }
const EMOJI_FONT = '"Apple Color Emoji","Segoe UI Emoji","Noto Color Emoji",sans-serif';
function emoji(ch, x, y, size){ ctx.font = `${Math.round(size)}px ${EMOJI_FONT}`; ctx.textAlign='center'; ctx.textBaseline='middle'; ctx.fillText(ch, x, y); }
function rrect(x,y,w,h,r,fill,stroke){ r=Math.min(r,w/2,h/2); ctx.beginPath(); ctx.moveTo(x+r,y); ctx.arcTo(x+w,y,x+w,y+h,r); ctx.arcTo(x+w,y+h,x,y+h,r); ctx.arcTo(x,y+h,x,y,r); ctx.arcTo(x,y,x+w,y,r); ctx.closePath(); if(fill){ctx.fillStyle=fill;ctx.fill();} if(stroke){ctx.strokeStyle=stroke;ctx.lineWidth=1.5;ctx.stroke();} }
function circle(x,y,r,fill){ ctx.beginPath(); ctx.arc(x,y,Math.max(.5,r),0,Math.PI*2); ctx.fillStyle=fill; ctx.fill(); }
function ellipse(x,y,rx,ry,fill){ ctx.beginPath(); ctx.ellipse(x,y,Math.max(.5,rx),Math.max(.5,ry),0,0,Math.PI*2); ctx.fillStyle=fill; ctx.fill(); }
const P3 = (x,y,z)=>{ const q=iso(x,y); return {x:q.x, y:q.y - z*tw}; };
function box(x,y,w,d,h,col,z=0,alpha){
  if(alpha) ctx.globalAlpha=alpha;
  const top=[P3(x,y,z+h),P3(x+w,y,z+h),P3(x+w,y+d,z+h),P3(x,y+d,z+h)];
  poly([P3(x,y+d,z),P3(x+w,y+d,z),P3(x+w,y+d,z+h),P3(x,y+d,z+h)], shade(col,-.06));
  poly([P3(x+w,y,z),P3(x+w,y+d,z),P3(x+w,y+d,z+h),P3(x+w,y,z+h)], shade(col,-.22));
  poly(top, shade(col,.12), 'rgba(60,40,20,.12)');
  ctx.globalAlpha=1;
  const c=P3(x+w/2,y+d/2,z+h); return c;
}
function wallX(X,y0,y1,h,col,stripe,win){ // 沿 y 方向的牆（固定 x）
  const t=.05;
  poly([P3(X+t,y0,0),P3(X+t,y1,0),P3(X+t,y1,h),P3(X+t,y0,h)], shade(col,-.2));
  if(stripe) poly([P3(X+t,y0,0),P3(X+t,y1,0),P3(X+t,y1,Math.min(h,.07)),P3(X+t,y0,Math.min(h,.07))], stripe);
  if(win && h>.4) poly([P3(X+t,y0+.25,h*.42),P3(X+t,y1-.25,h*.42),P3(X+t,y1-.25,h*.8),P3(X+t,y0+.25,h*.8)], '#bfe0f2', 'rgba(255,255,255,.8)');
  poly([P3(X-t,y0,h),P3(X+t,y0,h),P3(X+t,y1,h),P3(X-t,y1,h)], shade(col,.3));
  poly([P3(X-t,y1,0),P3(X+t,y1,0),P3(X+t,y1,h),P3(X-t,y1,h)], shade(col,-.05));
}
function wallY(Y,x0,x1,h,col,stripe,win){ // 沿 x 方向的牆（固定 y）
  const t=.05;
  poly([P3(x0,Y+t,0),P3(x1,Y+t,0),P3(x1,Y+t,h),P3(x0,Y+t,h)], shade(col,-.04));
  if(stripe) poly([P3(x0,Y+t,0),P3(x1,Y+t,0),P3(x1,Y+t,Math.min(h,.07)),P3(x0,Y+t,Math.min(h,.07))], stripe);
  if(win && h>.4) poly([P3(x0+.25,Y+t,h*.42),P3(x1-.25,Y+t,h*.42),P3(x1-.25,Y+t,h*.8),P3(x0+.25,Y+t,h*.8)], '#cbe8f7', 'rgba(255,255,255,.8)');
  poly([P3(x0,Y-t,h),P3(x1,Y-t,h),P3(x1,Y+t,h),P3(x0,Y+t,h)], shade(col,.3));
  poly([P3(x1,Y-t,0),P3(x1,Y+t,0),P3(x1,Y+t,h),P3(x1,Y-t,h)], shade(col,-.22));

function drawPerson(x,y,o){

// ================= 遊戲邏輯 =================
function spawn(){
  if(RQ.length>=RQ_POS.length) return;
  const d=pick(pool());
  const p={id:nextId++, d:d.id, x:SPAWN.x, y:SPAWN.y+(Math.random()-.5)*.4, path:[], state:'recq', wait:0, phase:Math.random()*6,
    skin:pick(SKINS), hair:pick(HAIRS), shirt:pick(SHIRTS), pants:pick(PANTS), face:1, say:'', sayT:0, slip:0, slipped:{}, mood:'', room:null, seat:-1, litterKind:null, litterT:0};
  patients.push(p); RQ.push(p); goTo(p, ...RQ_POS[RQ.length-1]);
  if(!S.seen[d.id]){ S.seen[d.id]=1; const R=ROOMS[d.room]; toast(d.icon,'新怪病！'+d.name, S.rooms.some(r=>r.type===d.room)?'':'要蓋 '+R.icon+' '+R.name); }
  if(Math.random()<.1) talk(p);
}
function talk(p, txt){ p.say = txt || pick(SAYS); p.sayT = 3; }
function addRep(n){ S.rep = Math.max(0, S.rep + n); }
function goExit(p, mood){ p.state='exit'; p.mood=mood; p.hidden=false; p.room=null; goTo(p,13.5,10.5); p.path.push({x:SPAWN.x, y:SPAWN.y+(Math.random()-.5)*.5}); }
function detach(p){
  const i=RQ.indexOf(p); if(i>=0){ RQ.splice(i,1); RQ.forEach((q,k)=>retarget(q,RQ_POS[k])); }
  if(p.room && RT[p.room]){ const rt=RT[p.room], r=roomByKey(p.room); const k=rt.queue.indexOf(p); if(k>=0){ rt.queue.splice(k,1); rt.queue.forEach((q,n)=>retarget(q,qPos(r,n))); } if(rt.cur===p){ rt.cur=null; rt.prog=0; } }
  if(p.seat>=0){ seats[p.seat]=null; p.seat=-1; }
}
function lose(p, why){ detach(p); S.stats.lost++; addRep(-1); goExit(p,'😤'); sfx.bad(); ticker(`😤 ${DMAP[p.d].name}患者${why}（聲望 -1）`); }
function route(p){
  const d=DMAP[p.d], rooms=S.rooms.filter(r=>r.type===d.room);
  p.room=null;
  if(!rooms.length){ p.state='confused'; p.wait=0; p.path=[{x:11.2+Math.random()*.3,y:10.1+Math.random()*.4}]; if(Math.random()<.6) talk(p,'請問哪裡可以治'+d.name+'？'); return; }
  let best=null, bl=1e9; rooms.forEach(r=>{ const rt=RT[rkey(r)], l=rt.queue.length+(rt.cur?1:0)+seats.filter(q=>q&&q.room===rkey(r)).length; if(l<bl){ bl=l; best=r; } });
  const rt=RT[rkey(best)];
  if(rt.queue.length<QMAX) return joinQueue(p,best);
  const sl=seatList(); const free=sl.findIndex((s,k)=>!seats[k]);
  if(free>=0){ seats[free]=p; p.seat=free; p.room=rkey(best); p.state='toBench'; goTo(p,...sl[free]); p.face=BENCHES[Math.floor(free/3)].face; return; }
  lose(p,'看到滿滿的人潮，直接回家了');
}
function joinQueue(p,r){ const rt=RT[rkey(r)]; rt.queue.push(p); p.room=rkey(r); p.state='toQ'; p.face=1; goTo(p,...qPos(r,rt.queue.length-1)); }
function cure(p,r){
  const d=DMAP[p.d], fee=Math.round(d.fee*feeMult(r.lvl)*(buffOn('fee')?1.2:1));
  S.money+=fee; S.stats.earned+=fee; S.stats.cured++; r.n=(r.n||0)+1;
  const first=!S.dex[d.id]; S.dex[d.id]=(S.dex[d.id]||0)+1; addRep(buffOn('rep')?2:1);
  const c=P3(4*r.i+2.5,4*r.j+2,.9); floats.push({text:'+$'+fmt(fee),x:c.x,y:c.y,life:1.3,color:'#e09a12'});
  if(d.litter && Math.random()<.45){ p.litterKind=d.litter; p.litterT=.6+Math.random()*2.5; }
  RT[rkey(r)].cur=null; RT[rkey(r)].prog=0;
  goExit(p,'😄'); sfx.coin(); bump('money');
  ticker(`${first?'✨ 首次治癒！':'🩹'} ${d.name}：${d.cure}`);
}
function movePerson(p,dt,speed){
  if(p.slip>0){ p.slip-=dt; return false; }
  if(!p.path.length) return false;
  const wp=p.path[0], dx=wp.x-p.x, dy=wp.y-p.y, dist=Math.hypot(dx,dy), step=speed*dt;
  p.phase+=dt*11;
  if(dist<=step){ p.x=wp.x; p.y=wp.y; p.path.shift(); return !p.path.length; }
  p.x+=dx/dist*step; p.y+=dy/dist*step; return false;
}
function update(dt){
  clock+=dt;
  floats.forEach(f=>{ f.life-=dt; f.y-=dt*30; }); floats=floats.filter(f=>f.life>0);
  patients.forEach(p=>{ if(p.sayT>0) p.sayT-=dt; });
  if(modalOpen || !booted) return;
  if(!buffOn('closed')){ spawnT -= dt*(buffOn('spawn')?2:1); if(spawnT<=0){ if(patients.length<maxPatients()) spawn(); spawnT=spawnInterval()*(.6+Math.random()*.8); } }
  const sp=buffOn('speed')?1.5:1, lim=patienceLimit();
  // 移動
  patients.forEach(p=>{
    const fx=FX[p.d]||{}, spd=fx.slow?.85:fx.zombie?1.2:1.9;
    const arrived=movePerson(p,dt,spd);
    if(p.path.length && p.slip<=0 && p.state!=='treat'){ for(const l of litter){ if(l.k==='jelly' && !p.slipped[l.id] && Math.hypot(l.x-p.x,l.y-p.y)<.22){ p.slipped[l.id]=1; if(Math.random()<.35){ p.slip=1; sfx.slip(); ticker('🫠 有人踩到果凍滑了一跤！快請清潔阿姨。'); } } } }
    if(arrived){
      if(p.state==='toQ') p.state='queue';
      else if(p.state==='toBench') p.state='bench';
      else if(p.state==='enter'){ p.state='treat'; if(RLAY[roomByKey(p.room)?.type]?.hide) p.hidden=true; }
      else if(p.state==='exit') p.gone=true;
    }
    if(p.state==='exit' && p.litterKind){ p.litterT-=dt; if(p.litterT<=0){ const tx=Math.floor(p.x), ty=Math.floor(p.y); if(tx>=0&&ty>=0&&tx<MW&&ty<MW&&!roomKeyAt(tx,ty)&&litter.length<30){ litter.push({id:litId++,x:p.x,y:p.y,k:p.litterKind}); } p.litterKind=null; } }
  });
  // 櫃台
  if(RQ.length && !RQ[0].path.length){ recT+=dt*sp; if(recT>=.9){ recT=0; const p=RQ.shift(); RQ.forEach((q,k)=>retarget(q,RQ_POS[k])); p.wait=0; route(p); } } else recT=0;
  // 診間
  S.rooms.forEach(r=>{ const k=rkey(r), rt=RT[k]; if(!rt) return;
    if(!rt.cur && rt.queue.length){ const p=rt.queue[0]; if(p.state==='queue' && !p.path.length){ rt.queue.shift(); rt.cur=p; p.state='enter'; p.wait=0; goTo(p,...roomSpot(r,'pat')); rt.queue.forEach((q,n)=>retarget(q,qPos(r,n))); } }
    if(rt.cur && rt.cur.state==='treat'){ rt.prog+=dt*sp/timeOf(r); if(rt.prog>=1){ const p=rt.cur; p.x=4*r.i+3.5; p.y=4*r.j+2.5; p.hidden=false; cure(p,r); } }
  });
  // 長椅 → 診間
  patients.filter(p=>p.state==='bench'||p.state==='toBench').sort((a,b)=>b.wait-a.wait).forEach(p=>{
    const r=roomByKey(p.room); if(!r){ detach(p); route(p); return; }
    if(RT[p.room].queue.length<QMAX){ seats[p.seat]=null; p.seat=-1; joinQueue(p,r); }
  });
  // 耐心
  patients.forEach(p=>{
    if(p.state==='recq'||p.state==='queue'||p.state==='bench'){ if(!p.path.length) p.wait+=dt; if(p.wait>lim) lose(p,'等太久，氣噗噗地走了'); }
    else if(p.state==='confused'){ p.wait+=dt; if(p.wait>3.5) lose(p,'找不到能治的科別，默默離開了'); }
    if(S.lobby.vend && !p.drank && (p.state==='bench'||p.state==='recq') && Math.random()<dt*.025){ p.drank=1; S.money+=8; S.stats.earned+=8; const c=P3(11.75,9.2,.9); floats.push({text:'+$8',x:c.x,y:c.y,life:1,color:'#e2574c'}); if(Math.random()<.5){ p.litterKind=p.litterKind||'can'; p.litterT=1+Math.random()*2; } }
  });
  patients=patients.filter(p=>!p.gone);
  updateJanitors(dt);
  if(litter.length>=6 && !dirtyWarned){ dirtyWarned=true; ticker('🤢 走廊好髒，病人開始不耐煩了…'); }
  if(litter.length<3) dirtyWarned=false;
  eventT-=dt; if(eventT<=0){ eventT=70+Math.random()*50; if(S.stats.cured>=3) showEvent(); }
  flavorT-=dt; if(flavorT<=0){ flavorT=22+Math.random()*20; ticker(pick(FLAVOR)); }
  checkProgress();
}
function syncJanitors(reset){
  if(reset) jans=[];
  while(jans.length<S.lobby.jan) jans.push({id:jans.length+1,x:10.5+Math.random()*.6,y:11.4,path:[],state:'idle',t:Math.random()*3,phase:0,target:null});
}
function updateJanitors(dt){
  jans.forEach(j=>{
    if(j.state==='clean'){ j.t-=dt; if(j.t<=0){ const k=litter.indexOf(j.target); if(k>=0) litter.splice(k,1); j.target=null; j.state='idle'; j.t=.5; } return; }
    if(j.state==='go'){ if(!litter.includes(j.target)){ j.state='idle'; j.path=[]; return; } if(movePerson(j,dt,1.7)||(!j.path.length)){ j.state='clean'; j.t=1.1; } return; }
    j.t-=dt; movePerson(j,dt,1.2);
    const taken=new Set(jans.map(o=>o.target).filter(Boolean));
    const cand=litter.filter(l=>!taken.has(l));
    if(cand.length){ cand.sort((a,b)=>Math.hypot(a.x-j.x,a.y-j.y)-Math.hypot(b.x-j.x,b.y-j.y)); j.target=cand[0]; j.state='go'; goTo(j,j.target.x,j.target.y); return; }
    if(j.t<=0 && !j.path.length){ j.t=4+Math.random()*5; const spots=[[10.5,11.5],[8.5,10.5],[11.5,8.5],[6.5,8.5],[8.5,6.5],[12.5,8.5]]; const s=pick(spots); goTo(j,s[0]+Math.random()*.4,s[1]+Math.random()*.4); }
  });
}
function checkProgress(){
  const tt=titleOf(S.rep), ni=TITLES.findIndex(x=>x[1]===tt), oi=TITLES.findIndex(x=>x[1]===lastTitle);
  if(lastTitle && ni>oi){ sfx.fan(); queueModal({icon:'🎉',title:'診所升格！',body:`<p>恭喜院長，診所升格為</p><h3 style="margin:2px 0 8px">${tt}</h3><p>病人會來得更頻繁，也會出現更怪的病。</p>`,buttons:[{label:'太好了'}]}); }

}

function build(type,i,j){

  if(S.money<R.cost){ ticker('💸 錢不夠，再多治幾個病人吧。'); sfx.bad(); return false; }

  litter=litter.filter(l=>{ const s=slotOf(Math.floor(l.x),Math.floor(l.y)); return !(s&&s.i===i&&s.j===j); });
  sfx.build(); bump('money'); ticker(`🏗️ ${R.icon} ${R.name}開張了！`); if(S.tut<2) S.tut=2;
  saveLocal(); return true;
}
function demolish(r){

  affected.forEach(p=>{ if(p.seat>=0){ seats[p.seat]=null; p.seat=-1; } p.hidden=false; p.x=4*r.i+4.5; p.y=4*r.j+2.5; p.room=null; route(p); });
  const refund=Math.round(ROOMS[r.type].cost*.5); S.money+=refund;

const ptrs=new Map(); let gest=null;
cv.addEventListener('pointerdown',e=>{
  ensureAudio(); cv.setPointerCapture&&cv.setPointerCapture(e.pointerId);
  ptrs.set(e.pointerId,{x:e.clientX,y:e.clientY});
  if(ptrs.size===1) gest={sx:e.clientX,sy:e.clientY,moved:false,lx:e.clientX,ly:e.clientY};
  else if(ptrs.size===2){ const [a,b]=[...ptrs.values()]; gest={pinch:Math.hypot(a.x-b.x,a.y-b.y),moved:true}; }
});
cv.addEventListener('pointermove',e=>{
  if(!ptrs.has(e.pointerId)||!gest) return;
  ptrs.set(e.pointerId,{x:e.clientX,y:e.clientY});
  if(ptrs.size===1 && !gest.pinch){
    if(Math.hypot(e.clientX-gest.sx,e.clientY-gest.sy)>8) gest.moved=true;
    if(gest.moved){ const dx=e.clientX-gest.lx, dy=e.clientY-gest.ly; const a=dx/(tw/2), b=dy/(th/2); camX-=(a+b)/2; camY-=(b-a)/2; clampCam(); }
    gest.lx=e.clientX; gest.ly=e.clientY;
  } else if(ptrs.size===2){
    const [a,b]=[...ptrs.values()], d=Math.hypot(a.x-b.x,a.y-b.y), r=cv.getBoundingClientRect();
    if(gest.pinch){ zoomAt(d/gest.pinch,(a.x+b.x)/2-r.left,(a.y+b.y)/2-r.top); }
    gest.pinch=d;
  }
});
function endPtr(e){
  if(!ptrs.has(e.pointerId)) return;
  ptrs.delete(e.pointerId);
  if(gest && !gest.moved && !gest.pinch && ptrs.size===0){ const r=cv.getBoundingClientRect(); tap(e.clientX-r.left,e.clientY-r.top); }
  if(ptrs.size===0) gest=null; else if(ptrs.size===1){ const [p]=[...ptrs.values()]; gest={sx:p.x,sy:p.y,lx:p.x,ly:p.y,moved:true}; }
}
cv.addEventListener('pointerup',endPtr); cv.addEventListener('pointercancel',endPtr);
cv.addEventListener('wheel',e=>{ e.preventDefault(); const r=cv.getBoundingClientRect(); zoomAt(e.deltaY<0?1.12:1/1.12,e.clientX-r.left,e.clientY-r.top); },{passive:false});
function tap(sx,sy){
  if(!placing){
    let hit=null, hd=-1;
    patients.forEach(p=>{ if(p.hidden) return; const c=iso(p.x,p.y); if(Math.abs(sx-c.x)<tw*.2 && sy<c.y+tw*.05 && sy>c.y-tw*1.0){ if(p.x+p.y>hd){ hd=p.x+p.y; hit=p; } } });
    if(hit){ talk(hit, Math.random()<.4 ? DMAP[hit.d].desc : null); sfx.pop(); return; }
    const w=toWorld(sx,sy);
    const l=litter.find(l=>Math.hypot(l.x-w.x,l.y-w.y)<.4);
    if(l){ litter.splice(litter.indexOf(l),1); sfx.pop(); if(S.tut===2) S.tut=3; const c=iso(l.x,l.y); floats.push({text:'✨',x:c.x,y:c.y-tw*.2,life:.8,color:'#3fae7a'}); if(Math.random()<.3) ticker(pick(['🧹 院長親自打掃，大家都看到了。','🧹 院長默默把地上的東西撿起來，好有風範。','🧹 打掃完，地板亮到可以照出你的黑眼圈。'])); return; }
  }
  const w=toWorld(sx,sy), tx=Math.floor(w.x), ty=Math.floor(w.y), s=slotOf(tx,ty);
  if(!s) return;
  if(isLobby(s)){ if(!placing) openLobby(); return; }
  const r=roomAt(s.i,s.j);
  if(placing){ if(r){ ticker('這裡已經有房間了，換一塊空地吧。'); return; } if(build(placing,s.i,s.j)) setPlacing(null); return; }
  if(r) openRoom(r); else openBuild({i:s.i,j:s.j});
}

const isStandalone=()=>window.matchMedia('(display-mode: standalone)').matches||window.matchMedia('(display-mode: fullscreen)').matches||navigator.standalone===true;
(function(){ const de=document.documentElement, fs=de.requestFullscreen||de.webkitRequestFullscreen; if(fs && !isStandalone()){ $('zFull').classList.remove('hidden'); $('zFull').onclick=()=>{ try{ if(document.fullscreenElement||document.webkitFullscreenElement){ (document.exitFullscreen||document.webkitExitFullscreen).call(document); } else { const r=fs.call(de); if(r&&r.catch) r.catch(()=>ticker('這個瀏覽器不支援全螢幕，試試「加入主畫面」。')); } }catch(e){ ticker('這個瀏覽器不支援全螢幕，試試「加入主畫面」。'); } setTimeout(layout,300); }; } })();
$('zHome').onclick=()=>{ zoom=1; applyZoom(); camX=7.2; camY=7; };
$('sheetBody').addEventListener('click',e=>{ const b=e.target.closest('[data-act]'); if(!b||b.disabled) return; ensureAudio(); const f={pickBuild,upgrade,askDel,toggleMute,askReset,buyLobby}[b.dataset.act]; if(f) f(b.dataset.arg); });

function treatsChips(type){ return DISEASES.filter(d=>d.room===type).map(d=>`<span class="chip">${S.dex[d.id]||S.seen[d.id]?d.icon+' '+d.name:'❔ ???'}</span>`).join(''); }
let buildTarget=null;
function openBuild(slot){ buildTarget=slot; openSheet(buildHTML); }
function buildHTML(){
  const free=SLOT_ORDER.filter(([i,j])=>!roomAt(i,j)).length;
  const items=Object.entries(ROOMS).map(([k,R])=>{
    const locked=S.rep<R.rep, cant=S.money<R.cost||(!buildTarget&&!free);
    return `<div class="item ${locked?'locked':''}"><div class="ic" style="background:${shade(R.color,.6)}">${R.icon}</div>
      <div class="txt"><div class="nm">${R.name}</div><div class="ds">${R.desc}</div><div class="chips">${treatsChips(k)}</div></div>
      ${locked?`<div class="ds" style="text-align:right">🔒<br>聲望 ${R.rep}</div>`:`<button class="btn" ${cant?'disabled':''} data-act="pickBuild" data-arg="${k}">$${fmt(R.cost)}</button>`}</div>`;
  }).join('');
  return `<h2>🏗️ 建造新科別</h2><div class="sub">${buildTarget?'蓋在你點的這塊空地上。':(free?'選好之後，點地圖上發光的空地放置。':'空地都蓋滿了！可以拆掉舊的換新科別。')}　現有 💰 ${fmt(S.money)}・空地 ${free} 塊</div>${items}`;
}
function pickBuild(k){ if(buildTarget){ if(build(k,buildTarget.i,buildTarget.j)) closeSheet(); else refreshSheet(); } else { closeSheet(); setPlacing(k); } }
let roomSel=null, confirmDel=false;
function openRoom(r){ roomSel=r; confirmDel=false; openSheet(roomHTML); }
function roomHTML(){
  const r=roomSel; if(!r||!S.rooms.includes(r)) return '<div class="sub">房間不見了。</div>';
  const R=ROOMS[r.type], max=r.lvl>=MAXLV, cost=upCost(r), rt=RT[rkey(r)];
  return `<h2>${R.icon} ${R.name} <span style="font-size:14px;color:var(--soft)">Lv${r.lvl}</span></h2><div class="sub">${R.desc}</div>
    <div class="kv"><div>每位診療時間<b>${timeOf(r).toFixed(1)} 秒</b></div><div>收費倍率<b>x${feeMult(r.lvl).toFixed(2)}</b></div>
    <div>累計治好<b>${r.n||0} 人</b></div><div>門口排隊<b>${rt?rt.queue.length:0} 人</b></div></div>
    <div class="ds" style="font-size:13px;color:var(--soft)">可以治療：</div><div class="chips">${treatsChips(r.type)}</div>
    <div class="row"><button class="btn" ${max||S.money<cost?'disabled':''} data-act="upgrade">${max?'已達最高等級':`升級 $${fmt(cost)}`}</button></div>
    <div class="row"><button class="btn ${confirmDel?'danger':'ghost'}" data-act="askDel">${confirmDel?`確定拆除？回收 $${fmt(R.cost*.5)}`:'拆除這間'}</button></div>`;
}
function upgrade(){ const r=roomSel, c=upCost(r); if(r.lvl>=MAXLV||S.money<c) return; S.money-=c; r.lvl++; sfx.build(); bump('money'); ticker(`⬆️ ${ROOMS[r.type].name}升到 Lv${r.lvl}，醫生換了一件更亮的白袍。`); saveLocal(); refreshSheet(); }
function askDel(){ if(!confirmDel){ confirmDel=true; refreshSheet(); return; } demolish(roomSel); closeSheet(); }
function openLobby(){ openSheet(lobbyHTML); }
function lobbyHTML(){
  const items=Object.entries(LOBBY_UP).map(([k,U])=>{
    const lv=S.lobby[k], max=lv>=U.max, cost=U.cost[k==='bench'?lv:lv]||0;
    const lvTxt = k==='vend' ? (lv?'已設置':'未設置') : k==='bench' ? `${lv*3} 個座位` : `${lv} / ${U.max}`;
    return `<div class="item"><div class="ic" style="background:#eef5fd">${U.icon}</div><div class="txt"><div class="nm">${U.name}　<span style="font-size:12px;color:var(--soft)">${lvTxt}</span></div><div class="ds">${U.desc}</div></div>
      <button class="btn" ${max||S.money<cost?'disabled':''} data-act="buyLobby" data-arg="${k}">${max?'已滿':'$'+fmt(cost)}</button></div>`;
  }).join('');
  return `<h2>🛋️ 大廳與走廊</h2><div class="sub">整潔度 ${cleanPct()}%</div>${items}`;
}
function buyLobby(k){
  const U=LOBBY_UP[k], lv=S.lobby[k]; if(lv>=U.max) return; const cost=U.cost[lv]; if(S.money<cost) return;
  S.money-=cost; S.lobby[k]=lv+1; sfx.build(); bump('money');
  if(k==='jan'){ syncJanitors(); ticker('🧹 新的清潔阿姨報到！她說她什麼都見過。'); }
  else if(k==='bench') ticker('🪑 大廳多了一排長椅，病人坐下就不想走了。');
  else if(k==='plant') ticker('🪴 擺了一盆植物，大家的心情好像比較平靜了。');
  else ticker('🥤 飲料販賣機上線！它好像會偷偷觀察每個人。');
  saveLocal(); refreshSheet();
}
function dexHTML(){
  const found=DISEASES.filter(d=>S.dex[d.id]).length;
  const cards=DISEASES.map(d=>{
    if(S.dex[d.id]) return `<div class="card"><div class="big">${d.icon}</div><div class="nm">${d.name}</div>${d.desc}<div class="chips"><span class="chip">${ROOMS[d.room].icon} ${ROOMS[d.room].name}</span><span class="chip">治好 ${S.dex[d.id]} 人</span></div></div>`;
    if(S.seen[d.id]) return `<div class="card"><div class="big">${d.icon}</div><div class="nm">${d.name}</div>${d.desc}<div class="chips"><span class="chip">尚未治癒</span><span class="chip">需要 ${ROOMS[d.room].icon}</span></div></div>`;
    return `<div class="card unk"><div class="big">❔</div><div class="nm">？？？</div>${S.rep>=d.rep?'即將出現…':`聲望 ${d.rep} 後出現`}</div>`;
  }).join('');
  return `<h2>📖 怪病圖鑑</h2><div class="sub">已治癒 ${found} / ${DISEASES.length} 種怪病</div><div class="dex">${cards}</div>`;
}
let confirmReset=false;
function openOffice(){ confirmReset=false; openSheet(officeHTML); }
function officeHTML(){
  return `<h2>🏥 院長室</h2><div class="sub">${titleOf(S.rep)}・${cloud.status==='cloud'?'☁️ 雲端存檔（換裝置也接得上）':'📱 本機存檔'}</div>
    <div class="kv"><div>累計治好<b>${fmt(S.stats.cured)} 人</b></div><div>累計收入<b>$${fmt(S.stats.earned)}</b></div>
    <div>氣跑的病人<b>${fmt(S.stats.lost)} 人</b></div><div>科別數<b>${S.rooms.length} 間</b></div></div>
    <div class="toggle"><span>🔊 音效</span><button class="btn ghost" data-act="toggleMute">${S.muted?'關':'開'}</button></div>
    <div class="row"><button class="btn ${confirmReset?'danger':'ghost'}" data-act="askReset">${confirmReset?'真的要重新開業？進度會全部清除':'重新開業（清除進度）'}</button></div>
    ${ON_PAGES&&!isStandalone()?`<div class="toggle" style="display:block;font-weight:500;line-height:1.7"><b>📲 加到主畫面，全螢幕玩</b><br>iPhone：用 Safari 開 → 下方「分享」→「加入主畫面」<br>Android：用 Chrome 開 → 右上「⋮」→「加到主畫面」或「安裝應用程式」</div>`:''}
    <div class="sub" style="margin-top:14px">怪病診所 v0.4</div>`;
}
function toggleMute(){ S.muted=!S.muted; saveLocal(); refreshSheet(); }
function askReset(){ if(!confirmReset){ confirmReset=true; refreshSheet(); return; } S=newState(); S.day=today(); resetRuntime(); lastTitle=''; saveLocal(); cloudSave(true); closeSheet(); ticker('🏥 診所重新開業！'); S.tut=1; }

// ================= 對話框 =================
function toast(icon,title,sub){
  const el=document.createElement('div'); el.className='tst'; el.innerHTML=`<span class="ti">${icon}</span><span>${title}${sub?`<small>${sub}</small>`:''}</span>`;
  $('toast').appendChild(el); sfx.pop();
  setTimeout(()=>{ el.classList.add('out'); setTimeout(()=>el.remove(),350); },2800);
}
function queueModal(m){ modalQ.push(m); if(!modalOpen) nextModal(); }
function nextModal(){
  const m=modalQ.shift(); if(!m){ modalOpen=false; $('modalWrap').classList.add('hidden'); return; }
  modalOpen=true;
  $('modalBody').innerHTML=`<div class="mi">${m.icon}</div><h3>${m.title}</h3>${m.body}<div class="row">${m.buttons.map((b,i)=>`<button class="btn ${b.ghost?'ghost':''}" data-i="${i}">${b.label}</button>`).join('')}</div>`;
  $('modalWrap').classList.remove('hidden');
  $('modalBody').querySelectorAll('button[data-i]').forEach(btn=>btn.onclick=()=>{ ensureAudio(); const b=m.buttons[+btn.dataset.i]; modalOpen=false; $('modalWrap').classList.add('hidden'); if(b.fn) b.fn(); if(!modalOpen) nextModal(); });
}
function discoverModal(d){
  const has=S.rooms.some(r=>r.type===d.room), R=ROOMS[d.room];
  return {icon:d.icon,title:'新怪病出現！',body:`<h3 style="margin:0 0 6px">${d.name}</h3><p>${d.desc}</p><div class="note">需要：${R.icon} ${R.name}${has?'（你已經有了 👍）':S.rep>=R.rep?'（還沒蓋，快去建造！）':`（聲望 ${R.rep} 解鎖）`}</div>`,buttons:[{label:'收治！'}]};
}
function showEvent(){
  const ev=pick(EVENTS); sfx.pop();
  queueModal({icon:ev.icon,title:ev.title,body:`<p>${ev.text}</p>`,buttons:ev.choices.map((c,i)=>({label:c.label,ghost:i===1,fn:()=>applyOutcome(ev,c.fn())}))});
}
function applyOutcome(ev,o){
  const lines=[];
  if(o.money){ S.money=Math.max(0,S.money+o.money); lines.push(`<span class="delta ${o.money>0?'pos':'neg'}">💰 ${o.money>0?'+':''}${fmt(o.money)}</span>`); }
  if(o.rep){ addRep(o.rep); lines.push(`<span class="delta ${o.rep>0?'pos':'neg'}">⭐ ${o.rep>0?'+':''}${o.rep}</span>`); }
  if(o.buff){ S.buffs[o.buff[0]]=Date.now()+o.buff[1]*1000; lines.push(`<span class="delta pos">${BUFFNAME[o.buff[0]]}</span>`); }
  if(o.clean){ litter=[]; lines.push('<span class="delta pos">✨ 走廊全部清乾淨</span>'); }
  if(o.money>0||o.rep>0||o.buff||o.clean) sfx.coin(); else if(o.money<0||o.rep<0) sfx.bad();
  queueModal({icon:ev.icon,title:'結果',body:`<p>${o.text}</p>${lines.length?`<div class="note" style="text-align:center">${lines.join('　')}</div>`:''}`,buttons:[{label:'好喔'}]});
  saveLocal();
}

// ================= 回歸與每日紅包 =================
function today(){ const d=new Date(); return d.getFullYear()+'-'+(d.getMonth()+1)+'-'+d.getDate(); }
function welcomeBack(savedT){
  const away=Math.min(4*3600, Math.max(0,(Date.now()-savedT)/1000));
  const curable=pool().filter(d=>S.rooms.some(r=>r.type===d.room));
  let income=0;
  if(away>90 && curable.length){ const avg=curable.reduce((s,d)=>s+d.fee,0)/pool().length; income=Math.round(away/spawnInterval()*avg*.12); }
  let daily=0; const td=today(); if(S.day!==td){ daily=S.day? big(200):0; S.day=td; }
  if(income<=0 && daily<=0) return;
  S.money+=income+daily; S.stats.earned+=income+daily;
  const h=Math.floor(away/3600), m=Math.floor(away%3600/60);
  let body='';
  if(income>0) body+=`<p>你離開了 ${h?h+' 小時 ':''}${m} 分鐘。<br>${pick(AWAY)}</p><div class="note" style="text-align:center"><span class="delta pos">💰 +${fmt(income)}</span></div>`;
  if(daily>0) body+=`<p style="margin-top:10px">🧧 今日開診紅包</p><div class="note" style="text-align:center"><span class="delta pos">💰 +${fmt(daily)}</span></div>`;
  sfx.coin(); queueModal({icon:income>0?'🌙':'🧧',title:'院長回來了！',body,buttons:[{label:'開始看診'}]});
}
function tutorial(){
  if(S.tut>0) return;
  S.tut=1; S.day=today();
  ticker('🏥 歡迎，院長。病人快來了…');
}

// ================= 雲端存檔（可選） =================
const ON_PAGES=/\.github\.io$/.test(location.hostname);
const cloud={ref:null,status:'local',busy:false,last:''};
const sleep=ms=>new Promise(r=>setTimeout(r,ms));
async function initCloud(){
  if(ON_PAGES || location.protocol==='file:') return null;
  for(let i=0;i<25 && !(window.claude&&window.claude.use);i++) await sleep(200);
  if(!(window.claude&&window.claude.use)) return null;
  const [db,user]=await Promise.all([window.claude.use('db'),window.claude.use('user')]);
  if(!db||!user) return null;
  const uid=await user.id(); if(!uid) return null;
  cloud.ref=db.collection('data/users/'+uid).doc('save');
  const snap=await cloud.ref.get();
  cloud.status='cloud';
  if(snap && snap.exists){ const d=snap.data(); if(d && typeof d.json==='string'){ try{ return migrate(JSON.parse(d.json)); }catch(e){} } }
  return null;
}
async function cloudSave(force){
  if(!cloud.ref || cloud.busy) return;
  S.t=Date.now(); const j=JSON.stringify(S);
  if(!force && j===cloud.last) return;
  cloud.busy=true;
  try{ await cloud.ref.set({json:j,t:S.t}); cloud.last=j; cloud.status='cloud'; }
  catch(e){ if(e && ['invalid_argument','revoked','not_granted','capability_disabled'].includes(e.code)){ cloud.ref=null; cloud.status='local'; } }
  finally{ cloud.busy=false; }
}

// ================= 啟動 =================
let last=performance.now();
function loop(now){
  const dt=Math.min(.1,(now-last)/1000); last=now;
  update(dt); draw(); hud();
  saveT+=dt; if(saveT>5){ saveT=0; saveLocal(); }
  cloudT+=dt; if(cloudT>30){ cloudT=0; cloudSave(); }
  requestAnimationFrame(loop);
}
function boot(){
  const local=loadLocal(), hadLocal=!!local;
  S=local||newState(); resetRuntime(); lastTitle=titleOf(S.rep);
  const savedT=S.t;
  layout(); window.addEventListener('resize',layout);
  requestAnimationFrame(loop);
  if(!hadLocal && !ON_PAGES && location.protocol!=='file:') ticker('☁️ 讀取存檔中…');
  let settled=false;
  const apply=s=>{ S=s; resetRuntime(); lastTitle=titleOf(S.rep); ticker('☁️ 已載入雲端存檔。'); };
  const finish=cloudS=>{
    if(settled){ if(cloudS && cloudS.t>S.t+2000) apply(cloudS); return; }
    settled=true; let t0=savedT;
    if(cloudS && (!hadLocal || cloudS.t>savedT+2000)){ apply(cloudS); t0=cloudS.t; }
    booted=true;
    if(S.tut===0) tutorial(); else welcomeBack(t0);
    checkProgress(); saveLocal();
  };
  initCloud().then(finish).catch(()=>finish(null));
  setTimeout(()=>finish(null), hadLocal?1500:6000);
  document.addEventListener('visibilitychange',()=>{ if(document.hidden){ saveLocal(); cloudSave(); } });
}
boot();
if(ON_PAGES && 'serviceWorker' in navigator){ window.addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>{})); }
</script>
